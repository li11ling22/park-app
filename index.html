<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F97316">
<title>宠星盟乐园 · 经营工作台</title>
<style>
/* ============ 设计规范 CSS 变量（来自 design.md §1.5） ============ */
:root {
  --color-primary: #F97316;
  --color-primary-dark: #EA580C;
  --color-primary-light: #FFEDD5;
  --color-primary-softer: #FFF7ED;
  --color-secondary: #16A34A;
  --color-secondary-dark: #15803D;
  --color-secondary-light: #DCFCE7;
  --color-success: #22C55E;
  --color-success-bg: #DCFCE7;
  --color-success-text: #166534;
  --color-warning: #F59E0B;
  --color-warning-bg: #FEF3C7;
  --color-warning-text: #92400E;
  --color-danger: #EF4444;
  --color-danger-dark: #DC2626;
  --color-danger-bg: #FEE2E2;
  --color-danger-text: #991B1B;
  --color-info: #3B82F6;
  --color-info-bg: #DBEAFE;
  --color-info-text: #1E40AF;
  --color-bg: #F8F7F4;
  --color-card: #FFFFFF;
  --color-text: #1F2937;
  --color-text-2: #6B7280;
  --color-text-3: #9CA3AF;
  --color-border: #E5E7EB;
  --color-divider: #F3F4F6;
  --radius-card: 16px;
  --radius-panel: 12px;
  --radius-input: 10px;
  --radius-button: 10px;
  --radius-pill: 999px;
  --shadow-card: 0 1px 2px rgba(17, 24, 39, .04), 0 4px 12px rgba(17, 24, 39, .06);
  --shadow-hover: 0 4px 8px rgba(17, 24, 39, .06), 0 12px 24px rgba(17, 24, 39, .10);
  --shadow-modal: 0 8px 16px rgba(17, 24, 39, .12), 0 24px 48px rgba(17, 24, 39, .18);
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --space-1: 4px; --space-2: 8px; --space-3: 12px;
  --space-4: 16px; --space-5: 20px; --space-6: 24px; --space-8: 32px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 14px; }
body {
  font-family: var(--font-sans);
  background: var(--color-bg);
  color: var(--color-text);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
button { font-family: inherit; }
:focus-visible { outline: 2px solid var(--color-primary); outline-offset: 2px; }

/* ============ 布局骨架 ============ */
.page {
  max-width: 1200px; margin: 0 auto;
  padding: 24px;
  padding-bottom: calc(32px + env(safe-area-inset-bottom));
}
@media (max-width: 767px) {
  .page { padding: 16px; padding-bottom: calc(24px + env(safe-area-inset-bottom)); }
}

/* ============ 顶栏 ============ */
.app-header {
  position: sticky; top: 0; z-index: 50;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  height: 64px; padding: 0 24px; background: #fff;
  border-bottom: 1px solid var(--color-divider);
}
.app-header__deco {
  position: absolute; right: 70px; top: -12px;
  color: var(--color-primary); opacity: .12; pointer-events: none;
}
.app-header__deco svg { animation: decoFloat 12s ease-in-out infinite; }
@keyframes decoFloat {
  0%, 100% { transform: rotate(-40deg) translateY(0); }
  50% { transform: rotate(8deg) translateY(4px); }
}
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand__logo {
  width: 40px; height: 40px; border-radius: 12px; flex-shrink: 0;
  background: linear-gradient(135deg, #F97316, #F59E0B);
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 2px 6px rgba(249, 115, 22, .35);
}
.brand__text { min-width: 0; }
.brand__text h1 { font-size: 20px; font-weight: 700; color: var(--color-text); line-height: 1.2; white-space: nowrap; }
.brand__text p  { font-size: 11px; color: var(--color-text-2); letter-spacing: .05em; white-space: nowrap; }
.app-header__meta { display: flex; align-items: center; gap: 8px; color: var(--color-text-2); font-size: 13px; }
.header-divider { width: 1px; height: 20px; background: var(--color-border); }
@media (max-width: 767px) {
  .app-header { height: 56px; padding: 0 16px; }
  .brand__logo { width: 32px; height: 32px; border-radius: 10px; }
  .brand__logo svg { width: 20px; height: 20px; }
  .brand__text h1 { font-size: 18px; }
  .app-header__meta time { display: none; }
  .header-divider { display: none; }
  .app-header__meta .btn__label { display: none; }
  .app-header__deco { right: 52px; top: -10px; }
}
@media (max-width: 420px) { .app-header__deco { display: none; } }

/* ============ 按钮体系 ============ */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 40px; padding: 0 20px;
  border-radius: var(--radius-button);
  font-size: 14px; font-weight: 600;
  cursor: pointer; border: 1px solid transparent;
  transition: all 150ms ease; white-space: nowrap; text-decoration: none;
}
@media (max-width: 767px) { .btn { min-height: 44px; font-size: 16px; } }
.btn:active { transform: scale(.98); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn--sm { min-height: 36px; padding: 0 14px; font-size: 13px; }
@media (max-width: 767px) { .btn--sm { min-height: 44px; font-size: 14px; padding: 0 16px; } }
.btn--primary { background: var(--color-primary); color: #fff; }
.btn--primary:hover { background: var(--color-primary-dark); }
.btn--secondary { background: #fff; border-color: var(--color-border); color: var(--color-text); }
.btn--secondary:hover { border-color: var(--color-text-3); }
.btn--danger-ghost { background: #fff; border-color: var(--color-danger); color: var(--color-danger-dark); }
.btn--danger-ghost:hover { background: var(--color-danger-bg); }
.btn--danger { background: var(--color-danger); color: #fff; }
.btn--danger:hover { background: var(--color-danger-dark); }
.btn--ghost { background: transparent; color: var(--color-primary-dark); }
.btn--ghost:hover { background: var(--color-primary-light); }

/* ============ 标签体系 ============ */
.tag {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 10px; border-radius: var(--radius-pill);
  font-size: 12px; font-weight: 500; line-height: 1.5; white-space: nowrap;
}
.tag--success { background: var(--color-success-bg); color: var(--color-success-text); }
.tag--blue { background: #DBEAFE; color: #1E40AF; }
.tag--warning { background: var(--color-warning-bg); color: var(--color-warning-text); }
.tag--danger  { background: var(--color-danger-bg);  color: var(--color-danger-text); }
.tag--info    { background: var(--color-info-bg);    color: var(--color-info-text); }
.tag--neutral { background: #F3F4F6; color: var(--color-text-2); }
.tag--primary { background: var(--color-primary-light); color: var(--color-primary-dark); }
.tag--male    { background: var(--color-info-bg); color: var(--color-info-text); }
.tag--female  { background: #FCE7F3; color: #BE185D; }
.ch--xh { background: #FEF2F2; color: #DC2626; }
.ch--dy { background: #F3F4F6; color: #111827; }
.ch--wx { background: #ECFDF5; color: #047857; }
.ch--mt { background: #FFFBEB; color: #B45309; }

/* ============ 表单 ============ */
.field { margin-bottom: var(--space-4); }
.field__label { display: block; font-size: 13px; font-weight: 500; color: #374151; margin-bottom: 6px; }
.field__label .req { color: var(--color-danger); }
.input, .select, .textarea {
  width: 100%; min-height: 40px; padding: 10px 12px;
  border: 1px solid var(--color-border); border-radius: var(--radius-input);
  font-size: 14px; color: var(--color-text); background: #fff;
  transition: border-color 150ms, box-shadow 150ms; font-family: inherit;
}
.textarea { resize: vertical; min-height: 60px; }
.input::placeholder { color: var(--color-text-3); }
.input:focus, .select:focus, .textarea:focus {
  outline: none; border-color: var(--color-primary);
  box-shadow: 0 0 0 3px rgba(249, 115, 22, .15);
}
@media (max-width: 767px) { .input, .select, .textarea { font-size: 16px; } }
.form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px 16px; }
.form-grid--2 { grid-template-columns: repeat(2, 1fr); }
@media (max-width: 767px) { .form-grid, .form-grid--2 { grid-template-columns: 1fr; } }
.search-box { position: relative; flex: 1; min-width: 200px; }
.search-box svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--color-text-3); pointer-events: none; }
.input--search { width: 100%; border-radius: 999px; padding-left: 36px; }
.search-box--wide { max-width: 520px; }
.select--auto { width: auto; min-width: 118px; }
.input--month { width: 150px; }
.filter-group { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.card-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
.hint { font-size: 12px; color: var(--color-text-3); }
.stat-card--click { cursor: pointer; transition: box-shadow .15s ease, transform .15s ease; }
.stat-card--click:hover { box-shadow: 0 6px 16px rgba(249, 115, 22, .15); transform: translateY(-1px); }
.stat-go { margin-top: 6px; font-size: 12px; color: var(--color-primary); font-weight: 600; }
.tx-summary { font-size: 13px; color: var(--color-text-2); padding: 8px 12px; background: var(--color-primary-softer); border-radius: 8px; margin-bottom: 8px; }
.sub-title { font-size: 13px; font-weight: 600; color: var(--color-text-2); margin: 16px 0 10px; }
.sub-title:first-child { margin-top: 0; }

/* ============ 卡片 ============ */
.card {
  background: var(--color-card); border-radius: var(--radius-card);
  box-shadow: var(--shadow-card); padding: 16px;
  transition: transform 150ms ease, box-shadow 150ms ease;
}
.card:hover { transform: translateY(-2px); box-shadow: var(--shadow-hover); }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.card-head h3 { font-size: 16px; font-weight: 600; }
.board-section { margin-bottom: 16px; }
.tab-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
.tab-title { font-size: 18px; font-weight: 600; }

/* ============ Tab 导航 ============ */
.tabs {
  position: sticky; top: var(--header-h, 64px); z-index: 45;
  display: flex; gap: 8px; margin: 0 0 20px; overflow-x: auto;
  padding-top: 12px; padding-bottom: 4px;
  background: var(--color-bg);
  scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  display: inline-flex; align-items: center; gap: 8px;
  min-height: 44px; padding: 0 18px; border-radius: 999px;
  background: #fff; border: 1px solid var(--color-border);
  color: var(--color-text-2); font-weight: 600; font-size: 14px;
  cursor: pointer; transition: all 150ms ease; white-space: nowrap;
}
.tab:hover { border-color: var(--color-primary); color: var(--color-primary-dark); }
.tab.active { background: var(--color-primary); color: #fff; border-color: var(--color-primary); box-shadow: 0 4px 12px rgba(249, 115, 22, .3); }
.tab-panel { display: none; }
.tab-panel.active { display: block; animation: fadeIn .2s ease; }

/* 栏目内小导航（子栏目快速跳转 / 筛选） */
.subnav { position: sticky; top: calc(var(--header-h, 64px) + var(--tabs-h, 56px)); z-index: 40; display: flex; gap: 8px; flex-wrap: wrap; padding: 10px 0; margin: 2px 0 14px; background: var(--color-card); border-bottom: 1px solid var(--color-border); }
.subnav__btn { font-size: 13px; line-height: 1; padding: 7px 13px; border-radius: 999px; border: 1px solid var(--color-border); background: var(--color-bg); color: var(--color-text-2); cursor: pointer; white-space: nowrap; transition: .15s; }
.subnav__btn:hover { border-color: var(--color-primary); color: var(--color-primary-dark); }
.subnav__btn.is-active { background: var(--color-primary); color: #fff; border-color: var(--color-primary); }
section[id], #financeStats, #sec-charts { scroll-margin-top: calc(var(--header-h, 64px) + var(--tabs-h, 56px) + var(--subnav-h, 48px) + 8px); }
/* V38 临时回家标记 */
.room--away { outline: 2px dashed #F59E0B; outline-offset: -2px; }
.room__away { position: absolute; top: 2px; right: 2px; width: 14px; height: 14px; line-height: 14px; text-align: center; font-size: 9px; border-radius: 4px; background: #F59E0B; color: #fff; }
.room__away--lb { right: auto; left: 2px; }
.room { position: relative; }
.cal-cell--away { background-image: repeating-linear-gradient(45deg, rgba(245,158,11,.30) 0 4px, transparent 4px 8px) !important; }
/* V50 房间总览/日历格子小标记：洗/食/接（比 room__away 更小，约 8px） */
.mk { display: inline-block; font-size: 8px; line-height: 1; padding: 1px 2px; border-radius: 3px; margin: 0 1px; font-weight: 700; color: #fff; vertical-align: middle; }
.mk--bath { background: #0EA5E9; }
.mk--food { background: #16A34A; }
.mk--pickup { background: #F59E0B; }
.room__marks { display: flex; flex-wrap: wrap; gap: 1px; justify-content: center; margin-top: 1px; }
/* V38 老客狗狗资料内联建议 */
.dog-sug { margin-top: 6px; border: 1px solid var(--color-border); border-radius: 10px; overflow: hidden; background: var(--color-bg); max-height: 260px; overflow-y: auto; }
.dog-sug__hd { padding: 7px 10px; font-size: 12px; color: var(--color-text-2); background: var(--color-bg-2, #f4f5f7); }
.dog-sug__it { display: block; width: 100%; text-align: left; padding: 9px 10px; border: 0; border-top: 1px solid var(--color-border); background: transparent; cursor: pointer; }
.dog-sug__it:hover { background: var(--color-primary-soft, rgba(99,102,241,.08)); }
.dog-sug__it b { display: block; font-size: 13px; color: var(--color-text); }
.dog-sug__it i { display: block; font-size: 12px; font-style: normal; color: var(--color-text-2); margin-top: 2px; }
.dog-sug__x { display: block; width: 100%; padding: 8px; border: 0; border-top: 1px solid var(--color-border); background: transparent; color: var(--color-text-2); font-size: 12px; cursor: pointer; }
.dog-sug-tip:empty { display: none; }
.dog-sug-tip { color: var(--color-success-text, #16A34A); }
/* V38 提醒模板选择卡 */
.tpl-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
@media (min-width: 1024px) { .tpl-grid { grid-template-columns: 1fr 1fr; } }
.tpl-card { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 14px; border-radius: 12px; border: 1px solid var(--color-border); background: var(--color-bg); cursor: pointer; transition: .15s; }
.tpl-card:hover { border-color: var(--color-primary); background: var(--color-primary-soft, rgba(99,102,241,.06)); }
.tpl-card__ic { flex: 0 0 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 10px; background: var(--color-bg-2, #f4f5f7); color: var(--color-primary); }
.tpl-card__tx { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.tpl-card__tx b { font-size: 14px; color: var(--color-text); }
.tpl-card__tx i { font-size: 12px; font-style: normal; color: var(--color-text-2); }
.tpl-chip { display: inline-flex; align-items: center; gap: 5px; padding: 6px 12px; margin: 0 6px 6px 0; border-radius: 999px; border: 1px solid var(--color-border); background: var(--color-bg); color: var(--color-text-2); font-size: 13px; cursor: pointer; }
.tpl-chip.is-active { background: var(--color-primary); border-color: var(--color-primary); color: #fff; }
.goal-bar { height: 6px; background: var(--color-border); border-radius: 999px; margin-top: 8px; overflow: hidden; }
.goal-bar__fill { height: 100%; background: var(--color-primary); border-radius: 999px; }
.goal-pct { font-size: 12px; font-weight: 600; color: var(--color-text-2); margin-top: 4px; }
.goal-pct.done { color: var(--color-success-text); }
.stat-card__label { font-size: 12px; color: var(--color-text-2); }
.stat-card__value { font-size: 20px; font-weight: 700; color: var(--color-text); font-variant-numeric: tabular-nums; }
.stat-card__sub { font-size: 12px; color: var(--color-text-2); margin-top: 2px; }
/* V39b 支出分类对比（按年月） */
.expcmp { display: flex; flex-direction: column; gap: 6px; }
.expcmp__row { display: grid; grid-template-columns: 88px 1fr 96px 132px; gap: 10px; align-items: center; font-size: 13px; }
.expcmp__row--head { font-size: 12px; color: var(--color-text-3); }
.expcmp__name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.expcmp__bars { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.expcmp__bar { height: 10px; border-radius: 5px; }
.expcmp__bar i { display: block; height: 100%; border-radius: 5px; background: #F59E0B; min-width: 2px; }
.expcmp__bar--base i { background: #E5E7EB; }
.expcmp__bar-lbl { font-size: 10px; color: var(--color-text-3); }
.expcmp__amt { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
.expcmp__d { text-align: right; font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.expcmp__d--up { color: #DC2626; }
.expcmp__d--down { color: #16A34A; }
.expcmp__d--same, .expcmp__d--none { color: var(--color-text-3); }
.expcmp__row--total { border-top: 1px dashed var(--color-border); padding-top: 8px; font-weight: 700; }
@media (max-width: 767px) { .expcmp__row { grid-template-columns: 60px 1fr 80px; gap: 8px; } .expcmp__row .expcmp__d { grid-column: 1 / 4; text-align: left; padding-left: 68px; } }
.oplog-row { display: grid; grid-template-columns: 132px 64px 108px 1fr; gap: 10px; align-items: baseline; padding: 8px 4px; border-bottom: 1px solid var(--color-border); font-size: 13px; }
.oplog-time { color: var(--color-text-2); font-variant-numeric: tabular-nums; }
.oplog-who { color: var(--color-primary-dark); font-weight: 600; }
.oplog-act { color: var(--color-text); }
.oplog-det { color: var(--color-text-2); word-break: break-all; }
@media (max-width: 767px) { .oplog-row { grid-template-columns: 1fr; gap: 2px; } .oplog-who, .oplog-act { display: inline; margin-right: 8px; } }

/* ============ 统计卡 ============ */
.stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 16px; }
@media (max-width: 1023px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 767px) { .stats-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; } }
.stat-card { display: flex; align-items: center; gap: 12px; padding: 16px; }
.stat-icon { width: 40px; height: 40px; border-radius: 12px; background: var(--color-primary-light); color: var(--color-primary-dark); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.stat-icon--income { background: var(--color-success-bg); color: var(--color-success-text); }
.stat-icon--expense { background: var(--color-danger-bg); color: var(--color-danger-text); }
.stat-info { min-width: 0; }
.stat-label { font-size: 12px; color: var(--color-text-2); }
.stat-value { font-size: 22px; font-weight: 700; color: var(--color-text); line-height: 1.3; font-variant-numeric: tabular-nums; }
@media (max-width: 767px) { .stat-value { font-size: 16px; } }
.stat-sub { font-size: 11px; color: var(--color-text-3); }
.stat-value--income { color: var(--color-success-text); }
.stat-value--expense { color: var(--color-danger-text); }
.stat-value--net { color: var(--color-primary-dark); }
.ring-wrap { position: relative; width: 64px; height: 64px; flex-shrink: 0; }
.ring-num { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; color: var(--color-primary-dark); font-variant-numeric: tabular-nums; }

/* ============ 「今天要处理」置顶区 ============ */
.today-todo { margin-bottom: 16px; }
.today-todo__head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--color-divider); }
.today-todo__title { display: flex; align-items: center; gap: 8px; }
.today-todo__title h2 { font-size: 16px; font-weight: 600; }
.dot-danger { width: 8px; height: 8px; border-radius: 50%; background: var(--color-danger); }
.badge-num { min-width: 20px; height: 20px; border-radius: 999px; background: var(--color-danger); color: #fff; font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; padding: 0 6px; }
.tab__badge { display: inline-flex; align-items: center; justify-content: center; min-width: 18px; height: 18px; margin-left: 6px; padding: 0 5px; border-radius: 9px; background: var(--color-danger); color: #fff; font-size: 11px; font-weight: 700; line-height: 1; }
.tab.active .tab__badge { background: #fff; color: var(--color-primary); }
.todo-list { list-style: none; }
/* V36 快捷工资填写表 */
.qs-table th, .qs-table td { padding: 6px 8px; vertical-align: middle; }
.qs-table .input { height: 32px; padding: 4px 8px; font-size: 13px; }
.qs-table .qs-money { width: 92px; text-align: right; }
.qs-table .qs-name { width: 92px; }
.qs-table .qs-total { font-variant-numeric: tabular-nums; }
.qs-table tr.qs-blank { background: var(--color-primary-softer); }
.qs-table tfoot td { border-top: 2px solid var(--color-border); padding-top: 8px; }
@media (max-width: 720px) {
  .qs-table { min-width: 780px; }
}
.todo-item { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--color-border); }
.todo-item:hover { background: #FAF8F4; }
.todo-item:last-child { border-bottom: none; }
.todo-item__time { width: 44px; font-weight: 600; font-size: 14px; color: var(--color-text); flex-shrink: 0; font-variant-numeric: tabular-nums; }
.todo-item--overdue { border-left: 3px solid var(--color-danger); }

.todo-item--hint { background: var(--color-primary-softer); }

.todo-item__act { flex-shrink: 0; display: flex; align-items: center; gap: 6px; margin-left: 2px; }
/* 整行按日期着色：逾期红 / 今天橙 / 明天蓝 */
.todo-item.todo-item--due-red    { background: var(--color-danger-bg); }
.todo-item.todo-item--due-orange { background: var(--color-warning-bg); }

.todo-item.todo-item--due-orange:hover { background: #FCE7B0; }
.todo-item.todo-item--due-blue:hover   { background: #C3DCF7; }
/* 包月洗澡补充卡片折叠 */
summary.card-head { display: flex; align-items: center; justify-content: space-between; list-style: none; cursor: pointer; }
summary.card-head::-webkit-details-marker { display: none; }

  /* 手机端不截断：完整显示「送谁回家·房间·主人」，必要时换行 */

  .todo-item__act { margin-left: auto; }
}

/* ============ 备份提示条 ============ */
.backup-banner {
  display: flex; align-items: center; gap: 12px; padding: 12px 16px; margin-bottom: 16px;
  background: var(--color-warning-bg); border: 1px solid #FDE68A; color: var(--color-warning-text);
  border-radius: var(--radius-panel); font-size: 13px; flex-wrap: wrap;
}
.backup-banner .backup-close { margin-left: auto; width: 32px; height: 32px; border: none; background: transparent; color: inherit; cursor: pointer; border-radius: 8px; display: flex; align-items: center; justify-content: center; }
.backup-banner .backup-close:hover { background: rgba(255,255,255,.6); }

/* ============ 空状态 ============ */
.empty { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--space-3); padding: 48px 16px; text-align: center; color: var(--color-text-3); }
.empty__icon { width: 64px; height: 64px; color: var(--color-text-3); opacity: .6; }
.empty__title { font-size: 15px; font-weight: 600; color: var(--color-text-2); }
.empty__desc { font-size: 13px; }
.empty--sm { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 20px; color: var(--color-text-3); font-size: 13px; }

/* ============ 寄养管理 / 宠物卡 ============ */
.pet-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
.pet-card { display: flex; gap: 12px; align-items: flex-start; padding: 14px; border: 1px solid var(--color-divider); }
.pet-card__avatar { width: 56px; height: 56px; border-radius: 12px; background: var(--color-primary-softer); color: var(--color-primary); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.pet-card__main { flex: 1; min-width: 0; }
.pet-card__name { display: flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 600; flex-wrap: wrap; }
.pet-card__meta { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--color-text-2); margin-top: 4px; flex-wrap: wrap; }
.pet-card__right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex-shrink: 0; }
.pet-card__fee { font-size: 16px; font-weight: 600; color: var(--color-primary-dark); font-variant-numeric: tabular-nums; }

/* ============ 列表行 ============ */
.room-mate-bar { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; padding: 8px 10px; margin-bottom: 10px; background: var(--color-primary-softer); border-radius: 10px; font-size: 13px; color: var(--color-text-2); }
  .fresh-cal { border: 1px solid var(--color-divider); border-radius: 12px; padding: 12px; margin-top: 12px; }
  .fc-head { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
  .fc-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .fc-day { min-height: 52px; border-radius: 8px; background: #F8F7F4; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 13px; color: #475569; }
  .fc-day--blank { background: transparent; }
  .fc-day--week { background: transparent; color: #94A3B8; font-size: 12px; min-height: 22px; }
  .fc-day--today { box-shadow: inset 0 0 0 2px var(--color-primary); }
  .fc-day--has { background: #FEF3C7; cursor: pointer; }
  .fc-day--has:hover { background: #FDE68A; }
  .fc-num { font-weight: 600; }
  .fc-info { font-size: 11px; color: #B45309; }
  .list-row { display: flex; align-items: center; gap: 12px; padding: 12px 10px; border: 1px solid var(--color-border); border-radius: 10px; background: var(--color-card, #fff); margin-bottom: 8px; cursor: pointer; transition: background 150ms, border-color 150ms, box-shadow 150ms; }
.list-row:hover { background: var(--color-primary-softer); border-color: var(--color-primary-light); }
.list-row:last-child { margin-bottom: 0; }
.list-row__main { flex: 1; min-width: 0; }
.list-row__title { display: flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 600; flex-wrap: wrap; }
.list-row__sub { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--color-text-2); margin-top: 4px; flex-wrap: wrap; }
.list-row__side { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; flex-shrink: 0; }
.row-actions { display: flex; gap: 4px; flex-wrap: wrap; }
@media (max-width: 767px) { .list-row { flex-wrap: wrap; } .list-row__side { flex-direction: row; align-items: center; } }

/* ============ 房间矩阵 ============ */
.room-legend { display: flex; gap: 16px; margin-bottom: 12px; font-size: 12px; color: var(--color-text-2); flex-wrap: wrap; }
.room-legend span { display: inline-flex; align-items: center; gap: 6px; }
.lg { width: 12px; height: 12px; border-radius: 4px; display: inline-block; flex-shrink: 0; }
.lg--free { background: #fff; border: 1px solid var(--color-border); }
.lg--occupied { background: var(--color-primary-light); border: 1px solid #FDBA74; }
.lg--booked { background: var(--color-primary-softer); border: 1px solid #FED7AA; }
.lg--booked-neutral { background: #F8FAFC; border: 1px dashed #CBD5E1; }
.lg--cleaning { background: var(--color-warning-bg); border: 1px solid #FDE68A; }
.lg--paid { background: #DCFCE7; border: 1px solid #86EFAC; }
.lg--debt { background: #FEF3C7; border: 1px solid #FCD34D; }
.lg--risk { background: #FEE2E2; border: 1px solid #FCA5A5; }
.lg--income { background: var(--color-success); }
.lg--expense { background: var(--color-danger); }
.room-matrix { display: flex; flex-direction: column; gap: 8px; }
.room-zone { display: flex; align-items: center; gap: 8px; }
.room-zone__label { flex-shrink: 0; width: 22px; height: 22px; border-radius: 6px; background: var(--color-primary-light); color: var(--color-primary-dark); font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
.room-zone__row { display: grid; grid-template-columns: repeat(auto-fill, minmax(46px, 1fr)); gap: 6px; flex: 1; }
.room {
  aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
  border-radius: 8px; font-size: 11px; font-weight: 600; cursor: pointer;
  border: 1px solid var(--color-border); background: #fff; color: var(--color-text-2);
  transition: all 150ms ease; font-family: inherit; padding: 0;
}
.room--occupied { background: var(--color-primary-light); border-color: #FDBA74; color: var(--color-primary-dark); }
.room--booked { background: var(--color-primary-softer); border-color: #FED7AA; color: #C2410C; }
.room--booked-neutral { background: #F8FAFC; border: 1px dashed #CBD5E1; color: #475569; }
.room--booked-neutral .room__dogs { color: #64748B; }
.room--cleaning { background: var(--color-warning-bg); border-color: #FDE68A; color: var(--color-warning-text); }
.room { flex-direction: column; gap: 1px; line-height: 1.1; padding: 2px; }
.room__no { font-weight: 700; font-size: 11px; }
.room__dogs { font-size: 9px; font-weight: 600; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; opacity: .92; }
.room__cnt { position: absolute; top: 1px; right: 2px; font-size: 8px; line-height: 1; background: rgba(0,0,0,.22); color: #fff; border-radius: 6px; padding: 0 3px; }
.room--multi { position: relative; }
.room--occupied .room__dogs { color: #7c2d12; }
.room--booked .room__dogs { color: #9a3412; }
/* V39 房间总览按付费状态上色：已付绿 / 欠费黄 / 风险红（整格上色，须放在 .room 基础样式之后才不被白底覆盖） */
.room--paid { background: #DCFCE7; border-color: #86EFAC; color: #166534; }
.room--paid .room__dogs { color: #14532d; }
.room--debt { background: #FEF3C7; border-color: #FCD34D; color: #92400E; }
.room--debt .room__dogs { color: #78350f; }
.room--risk { background: #FEE2E2; border-color: #FCA5A5; color: #991B1B; }
.room--risk .room__dogs { color: #7f1d1d; }
/* V53：多狗房间逐只上色——每只狗一个小圆标（绿=已付清 / 黄=欠费 / 红=风险），一眼看清哪只欠 */
.room__dogs { display: inline-flex; flex-wrap: wrap; gap: 2px; align-items: center; line-height: 1.1; }
.room__dog { display: inline-block; min-width: 16px; text-align: center; padding: 0 3px; border-radius: 5px; font-style: normal; font-weight: 700; font-size: 11px; }
.room__dog--paid { background: #16A34A; color: #fff; }
.room__dog--debt { background: #F59E0B; color: #fff; }
.room__dog--risk { background: #DC2626; color: #fff; }
.cal-x { font-size: 8px; vertical-align: super; opacity: .85; margin-left: 1px; }
.room:hover { transform: translateY(-2px); box-shadow: var(--shadow-card); }
@media (max-width: 767px) { .room-zone__row { grid-template-columns: repeat(auto-fill, minmax(38px, 1fr)); gap: 5px; } }
.room-detail__no { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
/* 临时房间（笼位）折叠 */
.room-zone--cage { flex-direction: column; align-items: stretch; gap: 4px; margin-top: 6px; }
.room-zone__toggle, .board-cage__toggle { display: flex; align-items: center; gap: 6px; width: 100%; padding: 8px 10px; border: 1px dashed var(--color-border); border-radius: 8px; background: #F8FAFC; color: var(--color-text-2); font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; }
.room-zone__toggle svg, .board-cage__toggle svg { transition: transform .15s ease; flex-shrink: 0; }
.room-zone__toggle[aria-expanded="true"] svg, .board-cage__toggle[aria-expanded="true"] svg { transform: rotate(90deg); }
.room-zone__badge, .room-zone__hint { margin-left: auto; font-size: 11px; font-weight: 600; }
.room-zone__badge { color: var(--color-primary-dark); background: var(--color-primary-light); padding: 1px 8px; border-radius: 999px; }
.room-zone__hint { color: var(--color-text-3); }
.room-zone__cage-row { padding-top: 4px; }
.board-cage { margin-top: 14px; border-top: 1px dashed var(--color-border); padding-top: 10px; }
.cal-cage-divider td { background: #F8FAFC; font-weight: 600; color: var(--color-text-3); text-align: center; padding: 4px 0; }
.room-detail__state { margin-bottom: 12px; }
.room-detail__rec { background: var(--color-primary-softer); border-radius: var(--radius-panel); padding: 12px; font-size: 13px; margin-bottom: 12px; }

/* V24 新增 */
.cal-cell--est { background: repeating-linear-gradient(45deg,#FFF7ED,#FFF7ED 3px,#FED7AA 3px,#FED7AA 6px); color:#9A3412; }
.lg--est { background: repeating-linear-gradient(45deg,#FFF7ED,#FFF7ED 3px,#FED7AA 3px,#FED7AA 6px); border-color:#FDBA74; }
.pet-card--alert { border-color:#FDBA74; background:#FFFBEB; }

/* V26：退房日待确认伸缩条 */
.est-bar { margin: 8px 0; }
.est-bar__head { display: flex; align-items: center; gap: 6px; background: #FFF7ED; border: 1px solid #FDBA74; border-radius: 10px; padding: 8px 12px; font-size: 13px; color: #9A3412; cursor: pointer; flex-wrap: wrap; }
.est-bar__head b { color: #EA580C; }
.est-bar__toggle { margin-left: auto; display: inline-flex; align-items: center; gap: 2px; font-weight: 600; }
.est-bar__body { border: 1px solid #FDBA74; border-top: none; border-radius: 0 0 10px 10px; padding: 8px 10px; max-height: 300px; overflow-y: auto; }
.est-item { display: flex; align-items: center; gap: 8px; padding: 6px 4px; border-bottom: 1px dashed #FED7AA; font-size: 13px; flex-wrap: wrap; }
.est-item:last-child { border-bottom: none; }
.est-item .dim { color: var(--color-text-3); }
.pet-card__right .btn { margin-top:4px; }
@media (max-width:768px){ .pet-card__right{ display:flex; flex-direction:column; gap:4px; align-items:stretch; } }

/* ============ 房间日历看板（房间查询表数字化） ============ */
.cal-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; max-height: 70vh; overflow-y: auto; border: 1px solid var(--color-border); border-radius: var(--radius-panel); }
table.cal { border-collapse: separate; border-spacing: 0; font-size: 12px; width: 100%; min-width: 760px; }
table.cal th, table.cal td { border-right: 1px solid var(--color-border); border-bottom: 1px solid var(--color-border); text-align: center; }
/* 吸顶表头（双行）：第1行=日期、第2行=星期，同属一个固定区域，纵向滚动时始终可见；
   --cal-h1 = 第1行实测高度，由 syncCalStickyOffset() 写入，保证第2行严丝合缝叠在下方 */
table.cal { --cal-h1: 27px; }
table.cal thead th, table.cal thead td { position: sticky; background: #fff; z-index: 2; }
table.cal thead tr:first-child th, table.cal thead tr:first-child td { top: 0; height: 26px; line-height: 1; padding: 0 1px; font-weight: 600; color: var(--color-text-2); }
table.cal thead tr:nth-child(2) th, table.cal thead tr:nth-child(2) td { top: var(--cal-h1); height: 18px; line-height: 1; padding: 0 1px; box-shadow: 0 1px 0 var(--color-border); }
table.cal thead th.cal-room, table.cal thead td.cal-room { z-index: 6; }
table.cal thead tr:nth-child(2) th.cal-room { box-shadow: 1px 0 0 var(--color-border), 0 1px 0 var(--color-border); }
.cal-room { position: sticky; left: 0; background: #fff; z-index: 3; min-width: 52px; font-weight: 600; color: var(--color-text-2); box-shadow: 1px 0 0 var(--color-border); }
.cal-room--wd { font-size: 10px; font-weight: 500; color: var(--color-text-3); }
.cal-head-day { font-variant-numeric: tabular-nums; }
.cal-head-day.today { color: var(--color-primary-dark); font-weight: 700; }
.cal-head-wd { font-size: 10px; font-weight: 500; color: var(--color-text-3); letter-spacing: -0.5px; white-space: nowrap; }
.cal-head-wd.cal-we { color: var(--color-danger); }
.cal-head-wd.today { color: var(--color-primary-dark); font-weight: 700; }
.cal-head-wd.cal-we.today { color: var(--color-danger); font-weight: 700; }
.cal-cell { width: 30px; height: 28px; padding: 0; cursor: pointer; font-size: 12px; color: var(--color-text-2); transition: filter 120ms ease; }
.cal-cell:hover { filter: brightness(.94); }
.cal-cell--empty { background: #fff; cursor: default; }
.cal-cell--gray { background: #E5E7EB; color: #9CA3AF; }
.cal-cell--yellow { background: #FEF3C7; color: #92400E; }
.cal-cell--green { background: #DCFCE7; color: #166534; }
.cal-cell--blue { background: #DBEAFE; color: #1E40AF; font-weight: 600; }
.cal-cell--risk { background: #FEE2E2; color: #991B1B; font-weight: 700; }
.cal-cell--renew { background: #fff; box-shadow: inset 0 0 0 2px #EF4444; color: #EF4444; font-weight: 700; }
.cal-cell--out { background: #fff; color: #C0C4CC; box-shadow: inset 0 0 0 1px #F0F0F0; }
.cal-cell--booked-neutral { background: #F8FAFC; border: 1px dashed #CBD5E1; color: #475569; font-weight: 600; }
.cal-cell.today { outline: 2px solid var(--color-primary); outline-offset: -2px; }
@media (max-width: 767px) { .cal-cell { width: 28px; height: 26px; } .cal-wrap { max-height: 64vh; } .cal-head-wd { font-size: 9px; } table.cal thead tr:first-child th, table.cal thead tr:first-child td { height: 24px; } }

/* ============ 表格（工资表） ============ */
.table-wrap { overflow-x: auto; }
.table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 660px; }
.table th { text-align: left; padding: 10px 12px; font-size: 12px; color: var(--color-text-2); font-weight: 600; border-bottom: 1px solid var(--color-border); white-space: nowrap; }
.table td { padding: 11px 12px; border-bottom: 1px solid var(--color-divider); font-variant-numeric: tabular-nums; }
.table tr:last-child td { border-bottom: none; }
.table__total { background: var(--color-primary-softer); }
.table__total td { font-weight: 600; }
@media (max-width: 767px) {
  .table { min-width: 0; display: block; }
  .table thead { display: none; }
  .table tbody { display: block; }
  .table tr { display: block; border: 1px solid var(--color-border); border-radius: 12px; margin-bottom: 10px; padding: 4px 6px; }
  .table td { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 8px 12px; border: none; }
  .table td::before { content: attr(data-label); font-size: 12px; color: var(--color-text-3); flex-shrink: 0; font-weight: 400; }
  .table td[data-label="操作"] { display: block; }
  .table td[data-label="操作"]::before { display: none; }
  .table td[data-label="操作"] .row-actions { justify-content: flex-end; }
}

/* ============ 收支流水 ============ */
.tx-list { display: flex; flex-direction: column; }
.tx-row { display: flex; align-items: center; gap: 12px; padding: 12px 8px; border-bottom: 1px solid var(--color-divider); }
.tx-row:last-child { border-bottom: none; }
.tx-row__icon { width: 34px; height: 34px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.tx-row__icon.income { background: var(--color-success-bg); color: var(--color-success-text); }
.tx-row__icon.expense { background: var(--color-danger-bg); color: var(--color-danger-text); }
.tx-row__main { flex: 1; min-width: 0; }
.tx-row__title { font-size: 14px; color: var(--color-text); }
.tx-row__remark { margin-left: 8px; font-size: 12px; color: var(--color-text-3); }
.tx-row__sub { font-size: 12px; color: var(--color-text-3); margin-top: 2px; }
.tx-row__amt { font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tx-row__amt.income { color: var(--color-success-text); }
.tx-row__amt.expense { color: var(--color-danger-text); }

/* ============ 图表 ============ */
.grid-8-4 { display: grid; grid-template-columns: repeat(12, 1fr); gap: 16px; margin-bottom: 16px; }
.grid-8-4 > section:first-child { grid-column: span 8; }
.grid-8-4 > section:last-child { grid-column: span 4; }
.salary-grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 16px; }
.salary-grid > section:first-child { grid-column: span 8; }
.salary-grid > section:last-child { grid-column: span 4; }
.sal-cards { display: grid; grid-template-columns: 1fr; gap: 12px; }
@media (max-width: 1023px) { .grid-8-4 > section, .salary-grid > section { grid-column: span 12 !important; } }
/* 电脑端工资表：整行铺满 + 员工卡多列并排（手机端保持单列不变） */
@media (min-width: 1024px) {
  .salary-grid { grid-template-columns: 1fr; }
  .sal-cards { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
  .sal-cards > .card { margin-bottom: 0; }
}
@media (min-width: 1440px) { .sal-cards { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.donut-wrap { display: flex; flex-direction: column; align-items: center; gap: 12px; }
.donut svg { display: block; }
.donut svg text { font-family: inherit; }
.donut-legend { width: 100%; list-style: none; display: flex; flex-direction: column; gap: 8px; }
.donut-legend li { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--color-text); }
.donut-legend li i { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
.donut-legend li b { margin-left: auto; font-weight: 600; font-variant-numeric: tabular-nums; }
.donut-legend li.dim { color: var(--color-text-3); }
.chart svg { display: block; width: 100%; height: auto; }
.chart svg text { font-family: inherit; }
.chart-legend { display: flex; gap: 16px; justify-content: center; margin-top: 8px; font-size: 12px; color: var(--color-text-2); }
.chart-legend span { display: inline-flex; align-items: center; gap: 6px; }
.seg { display: inline-flex; background: #F3F4F6; border-radius: 999px; padding: 3px; gap: 2px; }
.seg__btn { border: none; background: transparent; padding: 6px 12px; border-radius: 999px; font-size: 12px; font-weight: 600; color: var(--color-text-2); cursor: pointer; transition: all 150ms ease; min-height: 28px; font-family: inherit; }
.seg__btn.active { background: #fff; color: var(--color-primary-dark); box-shadow: 0 1px 3px rgba(17, 24, 39, .12); }
@media (max-width: 767px) { .seg__btn { min-height: 44px; padding: 6px 14px; font-size: 13px; } }
/* V34k 查询工具条 / 汇总 / 分页 */
.qbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
.qbar .input, .qbar .select { min-height: 34px; }
.qbar__chk { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--color-text-2); cursor: pointer; white-space: nowrap; }
.qsum { display: flex; flex-wrap: wrap; gap: 14px; padding: 8px 10px; background: #F9FAFB; border: 1px solid var(--color-border); border-radius: 8px; font-size: 12px; color: var(--color-text-2); margin-bottom: 10px; }
.qsum b { color: #111827; font-weight: 700; }
.pager { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.pager__btn { border: 1px solid var(--color-border); background: #fff; color: var(--color-text-2); padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; min-height: 32px; font-family: inherit; }
.pager__btn:hover:not(:disabled) { border-color: var(--color-primary); color: var(--color-primary-dark); }
.pager__btn:disabled { opacity: .4; cursor: not-allowed; }
.pager__info { font-size: 12px; color: var(--color-text-3); }
@media (max-width: 767px) { .pager__btn { min-height: 40px; } .qbar .input, .qbar .select { flex: 1 1 46%; min-width: 0; } }

/* ============ 进度条 ============ */
.progress-block { margin-top: 4px; }
.progress-block__top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; font-size: 14px; gap: 12px; flex-wrap: wrap; }
.progress-block__top b { font-size: 16px; color: var(--color-primary-dark); font-variant-numeric: tabular-nums; }
.progress { height: 10px; border-radius: 999px; background: #F3F4F6; overflow: hidden; }
.progress__fill { height: 100%; border-radius: 999px; background: var(--color-primary); transition: width 300ms ease; }

/* ============ 每周计划 ============ */
.week-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
@media (max-width: 767px) { .week-grid { grid-template-columns: 1fr; } }
.week-card { border: 1px solid var(--color-border); border-radius: var(--radius-panel); padding: 12px; background: #fff; }
.week-card__title { font-size: 14px; font-weight: 600; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
.week-card__title small { font-size: 12px; color: var(--color-text-3); font-weight: 400; }
.plan-slot { display: flex; flex-direction: column; gap: 6px; width: 100%; text-align: left; padding: 12px; border-radius: var(--radius-panel); border: 1px dashed var(--color-border); background: #fff; cursor: pointer; margin-bottom: 8px; transition: all 150ms ease; font-family: inherit; font-size: 13px; }
.plan-slot--empty { color: var(--color-text-3); align-items: center; flex-direction: row; justify-content: center; gap: 6px; min-height: 56px; }
.plan-slot--empty:hover { border-color: var(--color-primary); color: var(--color-primary-dark); background: var(--color-primary-softer); }
.plan-slot--filled { border-style: solid; border-color: var(--color-border); }
.plan-slot--filled:hover { border-color: var(--color-primary); box-shadow: var(--shadow-card); }
.plan-slot__title { font-size: 14px; font-weight: 600; color: var(--color-text); }
.plan-slot__meta { font-size: 12px; color: var(--color-text-3); }

/* ============ 资讯 ============ */
.tag-cloud { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.tag-pill { display: inline-flex; align-items: center; gap: 4px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--color-border); background: #fff; font-size: 13px; color: var(--color-text-2); cursor: pointer; transition: all 150ms ease; font-family: inherit; }
@media (max-width: 767px) { .tag-pill { min-height: 44px; } }
.tag-pill:hover { border-color: var(--color-primary); color: var(--color-primary-dark); }
.tag-pill.active { background: var(--color-primary); color: #fff; border-color: var(--color-primary); }
.tag-pill--hot { border-color: var(--color-primary); color: var(--color-primary-dark); background: var(--color-primary-light); }
.tag-pill--hot.active { background: var(--color-primary); color: #fff; }
.news-card { padding: 16px; margin-bottom: 12px; position: relative; }
.news-card--new { border-left: 3px solid var(--color-danger); }
.news-card__head { display: flex; align-items: flex-start; gap: 8px; flex-wrap: wrap; }
.news-card__head a { font-size: 15px; font-weight: 600; color: var(--color-text); text-decoration: none; flex: 1; min-width: 0; }
.news-card__head a:hover { color: var(--color-primary-dark); text-decoration: underline; }
.news-card__actions { display: flex; gap: 4px; flex-shrink: 0; flex-wrap: wrap; }
.news-card__meta { font-size: 12px; color: var(--color-text-3); margin-top: 6px; }
.news-card__summary { font-size: 13px; color: var(--color-text-2); margin-top: 6px; line-height: 1.6; }
.news-card__tags { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.news-card .seg { margin-top: 8px; }
/* ============ 事务提醒 ============ */
.rem-card { padding: 14px 16px; margin-bottom: 12px; position: relative; border-left: 3px solid var(--color-border); }
.rem-card--overdue { border-left-color: var(--color-danger); background: #FFF5F5; }
.rem-card--today { border-left-color: #F59E0B; background: #FFFBEB; }
.rem-card--pinned { box-shadow: 0 0 0 1px var(--color-primary-light); }
.rem-card--done { opacity: .6; }
.rem-card__head { display: flex; align-items: flex-start; gap: 8px; flex-wrap: wrap; }
.rem-pin { color: var(--color-primary); display: inline-flex; }
.rem-card__title { font-size: 15px; font-weight: 600; color: var(--color-text); flex: 1; min-width: 0; }
.rem-card__title.is-done { text-decoration: line-through; color: var(--color-text-3); }
.rem-card__actions { display: flex; gap: 4px; flex-shrink: 0; flex-wrap: wrap; }
.rem-card__note { font-size: 13px; color: var(--color-text-2); margin-top: 6px; line-height: 1.6; white-space: pre-wrap; }
.rem-card__meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 8px; font-size: 12px; color: var(--color-text-3); }
.rem-done-btn { margin-left: auto; }
.rem-card--bath { border-left-color: #38BDF8; }
.rem-bath { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 8px; padding: 8px 10px; background: #F0F9FF; border-radius: 8px; font-size: 13px; }
.rem-bath__cd { font-weight: 600; }
.rem-bath__cd.cd--ok { color: #0284C7; }
.rem-bath__cd.cd--today { color: #EA580C; }
.rem-bath__cd.cd--over { color: var(--color-danger); }
.rem-bath__cd.cd--none { color: var(--color-text-3); }
.rem-bath__iv { color: var(--color-text-2); }
.rem-bath__push { display: inline-flex; gap: 4px; align-items: center; margin-left: auto; }
.btn--xs { padding: 2px 8px; font-size: 12px; }


/* ============ 弹窗 ============ */
.modal-overlay { position: fixed; inset: 0; background: rgba(17, 24, 39, .5); display: flex; align-items: center; justify-content: center; z-index: 200; padding: 16px; animation: fadeIn 150ms ease; }
.modal { background: #fff; border-radius: 20px; width: 420px; max-width: 100%; max-height: 90vh; display: flex; flex-direction: column; overflow: hidden; box-shadow: var(--shadow-modal); animation: slideUp 180ms ease; }
.modal--wide { width: 700px; }
@media (max-width: 767px) { .modal { width: 100%; } }
.modal__head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--color-divider); flex-shrink: 0; }
.modal__head h3 { font-size: 16px; font-weight: 600; }
.modal__body { padding: 20px; overflow-y: auto; }
.modal__foot { display: flex; justify-content: flex-end; gap: 10px; padding: 14px 20px; border-top: 1px solid var(--color-divider); flex-shrink: 0; }
.modal__close { width: 36px; height: 36px; border: none; background: transparent; color: var(--color-text-3); cursor: pointer; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.modal__close:hover { background: #F3F4F6; color: var(--color-text); }
.danger-box__msg { margin: 0 0 10px; padding: 10px 12px; border-radius: 10px; background: #FEF2F2; border: 1px solid #FECACA; color: #B91C1C; font-size: 14px; line-height: 1.6; font-weight: 600; }
.danger-box .form-row { margin-top: 10px; }
.confirm-msg { font-size: 14px; color: var(--color-text); line-height: 1.7; }

/* ============ 详情布局 ============ */
.detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
@media (max-width: 767px) { .detail-grid { grid-template-columns: 1fr; } }
.kv-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px 16px; margin-bottom: 8px; }
@media (max-width: 767px) { .kv-grid { grid-template-columns: 1fr; } }
.kv { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; padding: 6px 0; border-bottom: 1px dashed var(--color-divider); }
.kv span { color: var(--color-text-3); flex-shrink: 0; }
.kv b { color: var(--color-text); font-weight: 600; text-align: right; }
.kv--full { grid-column: 1 / -1; }
.detail-actions { border: 1px solid var(--color-border); border-radius: var(--radius-panel); padding: 14px; margin-bottom: 16px; }
.detail-actions__title { font-size: 13px; font-weight: 600; color: var(--color-text-2); margin-bottom: 10px; }
.detail-actions__btns { display: flex; gap: 8px; flex-wrap: wrap; }
.pickups__head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
.pickup-row { display: flex; align-items: center; gap: 10px; padding: 10px; border: 1px solid var(--color-divider); border-radius: var(--radius-panel); margin-bottom: 8px; }
.pickup-row__icon { width: 32px; height: 32px; border-radius: 10px; background: var(--color-info-bg); color: var(--color-info-text); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.pickup-row__main { flex: 1; min-width: 0; font-size: 13px; }
.pickup-row__sub { font-size: 12px; color: var(--color-text-3); }
.pickup-row__act { display: flex; gap: 4px; flex-shrink: 0; flex-wrap: wrap; }
@media (max-width: 767px) { .pickup-row { flex-wrap: wrap; } }

/* ============ 数据管理 ============ */
.data-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }
.data-stat { background: var(--color-primary-softer); border-radius: var(--radius-panel); padding: 12px; text-align: center; }
.data-stat b { display: block; font-size: 20px; color: var(--color-primary-dark); font-variant-numeric: tabular-nums; }
.data-stat span { font-size: 12px; color: var(--color-text-2); }
.pending-row { display:flex; align-items:center; gap:10px; padding:12px; border:1px solid var(--color-border); border-radius:var(--radius-panel); margin-bottom:10px; }
.pending-row--done { opacity:.65; }
.pending-row__main { flex:1; min-width:0; }
.pending-row__title { font-weight:600; }
.pending-row__sub { font-size:12px; color:var(--color-text-2); }
.pending-row__amt { font-weight:700; color:var(--color-success-text); white-space:nowrap; }
.settle-summary { background:var(--color-primary-softer); border-radius:var(--radius-panel); padding:12px; margin:12px 0; }
.settle-row { display:flex; justify-content:space-between; padding:3px 0; font-size:14px; }
.settle-row--last { border-top:1px dashed var(--color-border); margin-top:4px; padding-top:6px; font-weight:700; }
.settle-row .danger { color:var(--color-danger-text); }
.tx-row__amt.receivable { color:var(--color-primary); }

.member-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;}
.member-card{background:#fff;border:1px solid #ECECEC;border-radius:12px;padding:12px;cursor:pointer;transition:.15s;}
.member-card:hover{border-color:#F97316;box-shadow:0 2px 8px rgba(0,0,0,.06);}
.member-card__head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.member-card__row{font-size:13px;color:#374151;margin:3px 0;}
.member-card__row.dim{color:#9CA3AF;font-size:12px;}

.data-actions { display: flex; flex-direction: column; gap: 10px; }

/* ============ Toast ============ */
#toastRoot { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); z-index: 300; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
@media (max-width: 767px) { #toastRoot { top: auto; bottom: calc(24px + env(safe-area-inset-bottom)); } }
.toast { display: flex; align-items: center; gap: 8px; background: #1F2937; color: #fff; padding: 10px 18px; border-radius: 10px; font-size: 14px; box-shadow: var(--shadow-modal); animation: toastIn 200ms ease; }
.toast--out { opacity: 0; transform: translateY(-8px); transition: all 250ms ease; }
@keyframes toastIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

/* ============ 无障碍 ============ */
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
  .card:hover { transform: none; }
}

/* ============ 云同步徽标 ============ */
.sync-badge{display:inline-flex;align-items:center;margin-left:8px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.sync-badge--off{background:#F1F5F9;color:#64748B}
.sync-badge--on{background:#DCFCE7;color:#166534}
.sync-badge--wait{background:#FEF3C7;color:#92400E}
.form-row{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.form-row label{font-size:13px;color:#475569;font-weight:600}

/* ================= V34 视觉与交互增强（2026-08-09） ================= */
/* —— 1) 房间下拉占用色标 —— */
.ropt { font-weight: 600; }
.ropt--occupied { color: #B91C1C; background: #FEF2F2; }
.ropt--booked   { color: #C2410C; background: #FFF7ED; }
.ropt--cleaning { color: #6B7280; background: #F3F4F6; }
.ropt--away     { color: #B45309; background: #FEF3C7; }
.ropt--free     { color: #15803D; background: #F0FDF4; }
select#bf-room optgroup { font-size: 12px; color: #6B7280; font-style: normal; }
.select--occupied { border-color: #EF4444 !important; background: #FEF2F2 !important; color: #B91C1C !important; font-weight: 600; }
.select--booked   { border-color: #F97316 !important; background: #FFF7ED !important; color: #C2410C !important; font-weight: 600; }
.select--cleaning { border-color: #D1D5DB !important; background: #F3F4F6 !important; color: #4B5563 !important; }
.select--free     { border-color: #22C55E !important; background: #F0FDF4 !important; color: #15803D !important; font-weight: 600; }

/* —— 2) 选房实时提示条 —— */
.room-tip { margin-top: 6px; padding: 7px 10px; border-radius: 8px; font-size: 12.5px; line-height: 1.5; border: 1px solid transparent; }
.room-tip b { font-weight: 700; }
.room-tip--none   { background: #F8FAFC; border-color: #E5E7EB; color: #6B7280; }
.room-tip--ok     { background: #F0FDF4; border-color: #BBF7D0; color: #15803D; }
.room-tip--warn   { background: #FFF7ED; border-color: #FED7AA; color: #9A3412; }
.room-tip--danger { background: #FEF2F2; border-color: #FECACA; color: #B91C1C; }
.room-legend { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.room-legend__i { font-size: 11px; padding: 2px 8px; border-radius: 999px; font-weight: 600; border: 1px solid transparent; }
.room-legend__i--occupied { background: #FEF2F2; border-color: #FECACA; color: #B91C1C; }
.room-legend__i--booked   { background: #FFF7ED; border-color: #FED7AA; color: #C2410C; }
.room-legend__i--cleaning { background: #F3F4F6; border-color: #E5E7EB; color: #4B5563; }
.room-legend__i--free     { background: #F0FDF4; border-color: #BBF7D0; color: #15803D; }

/* —— 3) 表单校验错误态 —— */
.input--error { border-color: #EF4444 !important; background: #FEF2F2 !important; box-shadow: 0 0 0 3px rgba(239, 68, 68, .12) !important; }
.hint--tight { margin-top: 4px; font-size: 11px; line-height: 1.45; color: #9CA3AF; }

/* —— 4) 表单整体观感提升 —— */
.input:focus, .select:focus, .textarea:focus { border-color: var(--color-primary); box-shadow: 0 0 0 3px rgba(249, 115, 22, .13); outline: none; }
.input:hover:not(:focus), .select:hover:not(:focus), .textarea:hover:not(:focus) { border-color: #D1D5DB; }
.field__label { letter-spacing: .2px; }
.field__label .req { margin-left: 3px; font-weight: 700; }
.sub-title { position: relative; padding-left: 10px; }
.sub-title::before { content: ''; position: absolute; left: 0; top: 50%; transform: translateY(-50%); width: 3px; height: 13px; border-radius: 2px; background: var(--color-primary); }
.bf-dog { border: 1px solid var(--color-border); border-radius: 12px; padding: 12px 14px 2px; margin-bottom: 10px; background: linear-gradient(180deg, #FFFDFB 0%, #FFFFFF 60%); transition: border-color .15s ease, box-shadow .15s ease; }
.bf-dog:hover { border-color: #FDBA74; box-shadow: 0 2px 10px rgba(249, 115, 22, .08); }
.bf-dog__head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.bf-dog__no { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; color: #9A3412; background: #FFF7ED; border: 1px solid #FED7AA; border-radius: 999px; padding: 2px 10px; }
.room-mate-bar { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; padding: 8px 10px; margin-bottom: 10px; background: var(--color-info-bg); border: 1px solid #BFDBFE; border-radius: 10px; font-size: 12.5px; color: var(--color-info-text); }
.form-grid { align-items: start; }
.bf-dog .form-grid { grid-template-columns: repeat(3, 1fr); }
.bf-dog .field { margin-bottom: 10px; }
@media (max-width: 900px) { .bf-dog .form-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 560px) { .bf-dog .form-grid { grid-template-columns: 1fr; } }

/* —— 5) 列表 / 卡片 / 标签可读性 —— */
.card { transition: box-shadow .16s ease, transform .16s ease; }
.list-row { transition: background .14s ease, box-shadow .14s ease; }
.list-row:hover { background: var(--color-primary-softer); box-shadow: inset 3px 0 0 var(--color-primary); }
.kv-grid .kv { transition: background .14s ease; border-radius: 6px; }
.kv-grid .kv:hover { background: #FAFAF9; }
.tag { letter-spacing: .2px; }
.modal__head h3 { letter-spacing: .3px; }
.modal__foot { position: sticky; bottom: 0; background: #fff; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: #E5E7EB; border-radius: 999px; border: 2px solid #fff; }
::-webkit-scrollbar-thumb:hover { background: #D1D5DB; }
@media (max-width: 767px) {
  .room-legend__i { font-size: 10px; padding: 2px 6px; }
  .bf-dog { padding: 10px 10px 2px; }
}

/* ============ 移动端增强（触控 / 刘海安全区 / 弹窗全屏 / 语音输入） ============ */
html { -webkit-text-size-adjust: 100%; }
body, button, input, select, textarea, .tab, .subnav__btn, .list-row, .stat-card--click { touch-action: manipulation; }
* { -webkit-tap-highlight-color: transparent; }
@media (max-width: 767px) {
  /* 关键：横向溢出只交给 .page/.tab-panel 用 clip 处理 —— clip 不创建滚动容器，
     不会破坏内部 .tabs/.subnav 的 position:sticky 吸顶；旧浏览器回退 hidden（仅失吸顶、不会横滑）。
     注意：绝不能在 html/body 上用 overflow-x:hidden，否则 body 变滚动容器会让 sticky 失效。 */
  .page, .tab-panel { overflow-x: hidden; overflow-x: clip; }
  .page { padding: 12px; padding-bottom: calc(20px + env(safe-area-inset-bottom)); }

  /* 顶栏紧凑 */
  .app-header { padding-top: calc(env(safe-area-inset-top)); height: calc(50px + env(safe-area-inset-top)); padding-left: 12px; padding-right: 12px; }
  .brand__title { font-size: 15px; }
  .brand__sub { font-size: 11px; }

  /* 顶部一级菜单：5 个标签完整可见，图标在上文字在下，不用横滑 */
  .tabs { gap: 4px; padding-top: 6px; padding-bottom: 4px; background: var(--color-bg); z-index: 45; }
  .tab { position: relative; flex: 1 1 0; min-width: 0; padding: 5px 2px; font-size: 11px; gap: 2px; flex-direction: column; justify-content: center; line-height: 1.25; min-height: 46px; border-radius: 10px; white-space: nowrap; }
  .tab svg { width: 18px; height: 18px; flex-shrink: 0; }
  .tab__badge { position: absolute; top: 2px; right: 2px; margin: 0; transform: scale(.8); }

  /* 二级菜单：吸顶 + 自动换行，所有按钮可见，不用横滑 */

/* 合并跨月碎片：房间查询表按月存，同一次连续寄养被切成多段 */
function mergeBoardingFragments() {
  if (meta.boardingMergedV24) return false;
  meta.boardingMergedV24 = true;
  var groups = {}, others = [], i, b, k;
  for (i = 0; i < boarding.length; i++) {
    b = boarding[i];
    if (!b || !b.room_no || !b.checkin_date || !fromRoomTable(b) || b.status === 'booked') { others.push(b); continue; }
    k = b.room_no + '||' + normPetName(b.pet_name);
    if (!groups[k]) groups[k] = [];
    groups[k].push(b);
  }
  var merged = [], joined = 0;
  Object.keys(groups).forEach(function (key) {
    var arr = groups[key].slice().sort(function (x, y) {
      return String(x.checkin_date).localeCompare(String(y.checkin_date));
    });
    var cur = null;
    arr.forEach(function (it) {
      if (cur && String(it.checkin_date) <= String(cur.checkout_expected || '')) {
        if (String(it.checkout_expected || '') > String(cur.checkout_expected || '')) cur.checkout_expected = it.checkout_expected;
        if (+it.amount) cur.amount = (+cur.amount || 0) + (+it.amount || 0);
        /* V28：跨月合并时合并标记——任一段未付/风险/包月则保留 */
        if (it.payment_status === 'unpaid') cur.payment_status = 'unpaid';
        if (it.risk_flag) cur.risk_flag = true;
        if (it.monthly) cur.monthly = true;
        cur._segs = (cur._segs || 1) + 1;
        joined++;
      } else {
        if (cur) merged.push(cur);
        cur = it;
      }
    });
    if (cur) merged.push(cur);
  });
  boarding = others.concat(merged);
  return joined > 0;
}

/* 状态归一：房间表导入的 status 是 'done'（非法值），按今天重算；同时自动判定包月 */
function normalizeBoardingStatus() {
  /* V41 确认闸门：状态不再按日期自动翻转——所有待办提醒必须等老板点对应「确认」按钮才消失。
     · 预订(booked) → 在住(boarding)：必须点「已接到」(quickCheckin)
     · 在住(boarding) → 已退房(checked_out)：必须点「已送回/今天退房」(quickCheckout)
     唯一仍自动处理的：已有 checkout_actual（老板显式点过退房）才标 checked_out；cancelled 跳过。
     占用率/日历按日期区间计算，与此无关，冻结翻转不影响房间占用数。 */
  var changed = false;
  boarding.forEach(function (b) {
    if (!b || !b.checkin_date || b.status === 'cancelled') return;
    if (b.checkout_actual && b.status !== 'checked_out') {
      b.status = 'checked_out';
      if (b.end_estimated) b.end_estimated = false;
      changed = true;
    }
    var mo = isMonthlyB(b);
    if (!!b.monthly !== mo) { b.monthly = mo; changed = true; }
  });
  return changed;
}

/* 包月洗澡排期：入住起每满 30 天一次 */
function bathSchedule(b) {
  var days = boardingDays(b), out = [], k = 1;
  if (days < 30 || !b.checkin_date) return out;
  while (k * 30 <= days && k <= 36) { out.push(addDaysStr(b.checkin_date, k * 30)); k++; }
  return out;
}
function nextBathDue(b) {
  if (b.next_bath) return b.next_bath;
  var done = b.baths || [], list = bathSchedule(b), i;
  for (i = 0; i < list.length; i++) if (done.indexOf(list[i]) < 0) return list[i];
  return null;
}
function markBathDone(id, dateStr) {

function normDate(v) {
  if (!v) return '';
  v = String(v).trim();
  var m1 = v.match(/^(\d{4})[-/.年](\d{1,2})[-/.月](\d{1,2})日?$/);
  if (m1) return m1[1] + '-' + pad2(+m1[2]) + '-' + pad2(+m1[3]);
  var m2 = v.match(/^(\d{1,2})[-/.月](\d{1,2})日?$/);
  if (m2) return new Date().getFullYear() + '-' + pad2(+m2[1]) + '-' + pad2(+m2[2]);
  return '';
}
function saveBathAdjust(id) {

function bathShift(id, days) {
  var b = boarding.find(function (x) { return x.id === id; });

function ctxNowStr(){ try { return new Date().toISOString(); } catch(e){ return String(Date.now()); } }

function ctxFingerprint(){

/* 检测上下文是否断裂：返回 { broken, issues[] } */
function ctxDetect(){
  var issues = [];
  CTX_GLOBALS.forEach(function(k){
    var v = (typeof window!=='undefined') ? window[k] : null;
    if (v === undefined || v === null) { issues.push('全局缺失:'+k); return; }
    if (k==='meta') { if (typeof v!=='object' || Array.isArray(v)) issues.push('类型错误:meta'); }
    else if (k==='commConfig' || k==='goals') { if (typeof v!=='object' || Array.isArray(v)) issues.push('类型错误:'+k); }
    else if (k==='oplog') { if (!Array.isArray(v)) issues.push('类型错误:oplog'); }
    else { if (!Array.isArray(v)) issues.push('类型错误:'+k+'('+(v===null?'null':typeof v)+')'); }
  });
  CTX_FUNCS.forEach(function(fn){
    try { if (typeof window[fn] !== 'function') issues.push('函数缺失:'+fn); } catch(e){ issues.push('函数检测异常:'+fn); }
  });
  try {
    if (!meta || typeof meta!=='object') issues.push('meta 缺失');
    else {
      if (typeof meta.dataVersion === 'undefined') issues.push('meta.dataVersion 缺失');
      if (!meta.seeded) issues.push('meta.seeded=false（疑似重置/首次）');
      if (!meta.reminderMigrated) issues.push('meta.reminderMigrated 缺失（事务提醒易丢）');
    }
  } catch(e){ issues.push('meta 检测异常'); }
  /* 与上次清单比对：任何核心数据从「有」骤降为「0」即视为断裂 */
  try {
    var m = ctxReadManifest();
    if (m && m.fingerprint) {
      var fp = ctxFingerprint();
      var drop = function(name, cur, prev){ if (prev>0 && cur===0) issues.push(name+' 数据骤降为0（疑似断裂）'); };
      drop('寄养', fp.boarding, m.fingerprint.boarding);
      drop('收支', fp.transactions, m.fingerprint.transactions);
      drop('会员', fp.members, m.fingerprint.members);
      drop('工资', fp.salary, m.fingerprint.salary);
      drop('事务提醒', fp.news, m.fingerprint.news);
    }
  } catch(e){}
  return { broken: issues.length>0, issues: issues };
}
/* 非破坏式分级恢复：T1 本地主存储重读 → T2 本机快照补回（只补不删）→ T3 云端交由常规同步 */
function ctxRecover(){
  var actions = [];
  CTX_GLOBALS.forEach(function(k){
    try {
      var v = (typeof window!=='undefined') ? window[k] : null;
      var isArr = Array.isArray(v);
      var isObj = (v && typeof v==='object' && !Array.isArray(v));
      /* 类型错误，或数组被清空（含空数组）都视为可恢复——尝试从本地主存储重读；
         若存储也无数据则保持空（绝不误恢复老板「主动清空」的数据）。 */
      var bad = (!v)
        || (k==='meta' && !isObj) || (k==='commConfig' && !isObj) || (k==='goals' && !isObj)
        || (k==='oplog' && !isArr)
        || ((k!=='meta'&&k!=='commConfig'&&k!=='goals'&&k!=='oplog') && !isArr)
        || (isArr && v.length===0);
      if (!bad) return;
      var keyMap = { boarding:KEYS.boarding, transactions:KEYS.transactions, salary:KEYS.salary, employees:KEYS.employees, members:KEYS.members, news:KEYS.news, posts:KEYS.posts, pendingIncome:KEYS.pending, tempHome:KEYS.tempHome, oplog:KEYS.oplog, meta:KEYS.meta, commConfig:KEYS.commConfig, goals:KEYS.goals };
      var rk = keyMap[k];
      if (rk) {
        var re = load(rk, (k==='meta'||k==='commConfig'||k==='goals') ? {} : []);
        if (k==='meta') meta = Object.assign({ seeded:false, roomsCleaning:[], sync:{} }, re);
        else if (typeof window!=='undefined') window[k] = re;
        /* 仅当确实读回了比当前更多的数据，才记为一次有效恢复 */
        if ((Array.isArray(re) && re.length>0) || (k==='meta' && re && Object.keys(re).length)) actions.push('T1重读'+k);
      }
    } catch(e){}
  });
  try {
    var snaps = listLocalSnapshots();
    if (snaps && snaps.length) {
      /* 遍历整个快照链（防御性快照可能压在链首且为断裂态），跳过空快照，取第一个有数据的 */
      CTX_GLOBALS.forEach(function(k){
        try {
          var cur = (typeof window!=='undefined') ? window[k] : null;
          var empty = (!cur) || (Array.isArray(cur)&&cur.length===0) || (k==='meta'&&(!cur||typeof cur!=='object'));
          if (!empty) return; /* 当前已有数据，绝不覆盖 */
          for (var si=0; si<snaps.length; si++) {
            var s0 = snaps[si].data;
            if (s0 && Array.isArray(s0[k]) && s0[k].length>0) {
              if (k==='meta') meta = Object.assign({}, s0.meta, (meta&&typeof meta==='object')?meta:{});
              else if (typeof window!=='undefined') window[k] = s0[k];
              actions.push('T2快照补'+k+'@'+si);
              break;
            }
          }
        } catch(e){}
      });
    }
  } catch(e){}
  actions.push('T3云端由常规同步守卫接管');
  return actions;
}

/* 开机自检主入口：检测 →（若断裂）先存快照再非破坏式恢复 → 记日志 → 写清单 */
function ctxGuardBoot(){

/* 清理「每月自动」固定支出的跨设备重复：

   这里只清理 remark 含「每月自动」的系统生成记录，同月同类只留一条；绝不触碰任何手工录入的账。 */
function dedupeAutoMonthly() {
  var seen = {}, out = [], removed = 0;
  transactions.forEach(function (t) {
    if (t && t.type === 'expense' && typeof t.remark === 'string' && t.remark.indexOf('每月自动') >= 0) {
      var k = (t.category || '') + '|' + String(t.date || '').slice(0, 7);
      if (seen[k]) { removed++; return; }
      seen[k] = 1;
    }
    out.push(t);
  });
  if (removed > 0) { transactions = out; }
  return removed;
}
/* V40i（老板定口径）：房租/硬件完全按真实录入走，系统早期自动生成的「每月自动」估算记录一律清除。
   判定：type=expense 且 (category=房租 或 硬件) 且 remark 含「每月自动」——这些百分之百是系统造的假估算，
   老板真实手动录入的房租/硬件（备注不含「每月自动」，如「八月房租」「新装空调」）一律保留，绝不误删。 */
function purgeAutoMonthly() {
  var before = transactions.length;
  transactions = transactions.filter(function (t) {
    if (!t || t.type !== 'expense') return true;
    if (t.category !== '房租' && t.category !== '硬件') return true;
    if (typeof t.remark !== 'string' || t.remark.indexOf('每月自动') < 0) return true;
    return false; /* 删除系统自动生成的假记录 */
  });
  return before - transactions.length;
}
