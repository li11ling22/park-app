    var done = b.away_pickup_done || [];
    var from = b.away_from || '';
    var back = b.away_back_plan || '';
    if (from === today && done.indexOf(today) < 0) {
      items.push({
        _cat: 'away-pickup', overdue: false, time: from.slice(5),
        html: '<div class="todo-item__main"><p>' + icon('car', 14) + ' 送「' + esc(b.pet_name) + '」回家 · ' + esc(b.room_no || '—') +
          ' <span class="tag tag--warning">今天送回</span></p></div>',
        action: '<button class="btn btn--secondary btn--sm" onclick="todoAwayPickupDone(\'' + b.id + '\',\'from\')">已接回</button>' +
                '<button class="btn btn--ghost btn--sm" onclick="openBoardingDetail(\'' + b.id + '\')">详情</button>'
      });
    }
    if (back === today && done.indexOf(today) < 0) {
      items.push({
        _cat: 'away-pickup', overdue: false, time: back.slice(5),
        html: '<div class="todo-item__main"><p>' + icon('car', 14) + ' 接「' + esc(b.pet_name) + '」回店 · ' + esc(b.room_no || '—') +
          ' <span class="tag tag--warning">今天接回</span></p></div>',
        action: '<button class="btn btn--secondary btn--sm" onclick="todoAwayPickupDone(\'' + b.id + '\',\'back\')">已送回</button>' +
                '<button class="btn btn--ghost btn--sm" onclick="openBoardingDetail(\'' + b.id + '\')">详情</button>'
      });
    }
  });

  /* V50c：接送提前提醒——明/后天要接回家或送回店的，今天先给预告，别等当天才冒出来。
     与上面的"当天接送"不重复（上面只判 today，这里是 +1/+2 天）。 */
  [1, 2].forEach(function (n) {
    var d = addDaysStr(today, n);
    awayList().forEach(function (b) {
      var from = b.away_from || '';
      var back = b.away_back_plan || '';
      if (from === d) {
        items.push({
          _cat: 'away-pickup', overdue: false, time: from.slice(5),
          html: '<div class="todo-item__main"><p>' + icon('car', 14) + ' 送「' + esc(b.pet_name) + '」回家 · ' + esc(b.room_no || '—') +
            ' <span class="tag tag--info">提前提醒：' + (n === 1 ? '明天' : '后天') + '送回</span></p></div>',
          action: '<button class="btn btn--ghost btn--sm" onclick="openBoardingDetail(\'' + b.id + '\')">详情</button>'
        });
      }
      if (back === d) {
        items.push({
          _cat: 'away-pickup', overdue: false, time: back.slice(5),
          html: '<div class="todo-item__main"><p>' + icon('car', 14) + ' 接「' + esc(b.pet_name) + '」回店 · ' + esc(b.room_no || '—') +
            ' <span class="tag tag--info">提前提醒：' + (n === 1 ? '明天' : '后天') + '接回</span></p></div>',
          action: '<button class="btn btn--ghost btn--sm" onclick="openBoardingDetail(\'' + b.id + '\')">详情</button>'
        });
      }
    });
  });

  /* V41 收费提醒（经营提示常驻，直到老板确认才消失）：
     ① 包月/预付到期且狗还在（未退房）且未「确认收到费用」→ 点「确认收款」关闭；
     ② 在住欠款（账面仍欠） → 点「收款」入账后自动消失。两者互斥避免重复。 */
  boarding.forEach(function (b) {
    var isBoarding = b.status === 'boarding';
    var isCheckedOut = b.status === 'checked_out';
    if (!isBoarding && !isCheckedOut) return;
    var expiredPrepay = b.paid_until && b.paid_until < today;
    var needConfirm = expiredPrepay && b.fee_confirmed_until !== b.paid_until;
    if (needConfirm) {
      items.push({
        _cat: 'biz', overdue: true, time: b.paid_until.slice(5),
        html: '<div class="todo-item__main"><p>' + icon('money', 14) + ' 「' + esc(b.pet_name) + '」包月/预付到期 · ' + esc(b.room_no || '—') +
          ' <span class="tag tag--danger">费用待确认收到</span></p></div>',
        action: '<button class="btn btn--secondary btn--sm" onclick="confirmFeeReceived(\'' + b.id + '\')">确认收款</button>' +
                '<button class="btn btn--ghost btn--sm" onclick="openPayForm(\'' + b.id + '\')">续费/收款</button>'
      });
    } else if (oweOf(b) > 0.5 && !b.payment_confirmed) {
      /* V44：已送回家的狗，只要老板还没「确认已收款」，待收款提醒就一直挂在经营提示里（对齐确认闸门）。
         未确认的狗即使被标记送回，也不会自动消失，必须点「确认已收款」才关闭。 */
      items.push({
        _cat: 'biz', overdue: true,
        time: (isCheckedOut ? (b.checkout_actual || b.checkout_expected || '') : (b.checkout_expected || '')).slice(5) || '—',
        html: '<div class="todo-item__main"><p>' + icon('money', 14) + ' 「' + esc(b.pet_name) + '」' + (isCheckedOut ? '已送回家' : '在住') + ' 欠款 ' + money(oweOf(b)) + ' · ' + esc(b.room_no || '—') +
          ' <span class="tag tag--danger">待收款</span></p></div>',
        action: (isCheckedOut
            ? '<button class="btn btn--primary btn--sm" onclick="confirmPaymentReceived(\'' + b.id + '\')">确认已收款</button>'
            : '<button class="btn btn--secondary btn--sm" onclick="openPayForm(\'' + b.id + '\')">收款</button>') +
          '<button class="btn btn--ghost btn--sm" onclick="openBoardingDetail(\'' + b.id + '\')">详情</button>'
      });
    }
  });

  /* V39d：洗澡/接送/收款类提醒直接归到对应分类（近期洗澡/接狗入园/收支流水），不再挤在事务提醒；
     未完成的全量显示（不限逾期/今天），洗澡提醒带「+1天」快捷拖后 */
  var remCatMap = { '洗澡': 'bath', '接送': 'checkin', '收款': 'biz' };
  news.forEach(function (n) {
    if (n.done) return;
    var cat = remCatMap[n.cat];
    if (!cat) return;
    var d = (n.due || '').slice(0, 10);
    var rl = !d ? '<span class="tag tag--neutral">未设时间</span>'
      : (d < today ? '<span class="tag tag--danger">逾期</span>' : (d === today ? '<span class="tag tag--warning">今天</span>' : '<span class="tag tag--info">' + d.slice(5) + '</span>'));
    items.push({
      _cat: cat,
      overdue: !!(d && d < today),
      time: (d || '').slice(5) || '—',
      html: '<div class="todo-item__main"><p>' + icon('bell', 14) + ' 「' + esc(n.title) + '」' +
        (n.interval ? ' <span class="tag tag--info">每' + n.interval + '天</span>' : '') + ' ' + rl + '</p></div>',
      action: '<button class="btn btn--secondary btn--sm" onclick="toggleDone(\'' + n.id + '\')">处理好了</button>' +
        (cat === 'bath' ? '<button class="btn btn--ghost btn--sm" onclick="pushReminderDue(\'' + n.id + '\',1)">+1天</button>' : '') +
        '<button class="btn btn--ghost btn--sm" onclick="openReminderForm(\'' + n.id + '\')">改</button>'
    });
  });

  /* 事务提醒（通用类；洗澡/接送/收款已归对应板块）：老板建的每条待办都自动可见。
     V48g：取消 14 天窗口限制——逾期 / 今天 / 未来(按日期升序) / 未设时间 全部列出，
           不再折叠到「查看全部」，解决「建了提醒却看不到」的问题。 */
  var pendRem = news.filter(function (n) { return !n.done && ['洗澡', '接送', '收款'].indexOf(n.cat) < 0 && !(n.id && n.id.indexOf('care_') === 0); });
  var overdueRem = pendRem.filter(function (n) { return n.due && n.due < today; });
  var todayRem = pendRem.filter(function (n) { return n.due && n.due.slice(0, 10) === today; });
  var futureRem = pendRem.filter(function (n) { return n.due && n.due > today; }).sort(function (a, b2) { return a.due < b2.due ? -1 : 1; });
  var noDateRem = pendRem.filter(function (n) { return !n.due; });
  overdueRem.forEach(function (n) {
    items.push({ _cat: remSubnavKey(n.cat), overdue: true, time: (n.due.length > 10 ? n.due.slice(11, 16) : '逾期'), html: '<div class="todo-item__main"><p>' + icon('bell', 14) + ' 「' + esc(n.title) + '」 <span class="tag tag--danger">逾期</span></p></div>', action: '<button class="btn btn--ghost btn--sm" onclick="setTodoCat(this,\'reminder\')">去处理</button>' });
  });
  todayRem.forEach(function (n) {
    items.push({ _cat: remSubnavKey(n.cat), overdue: false, time: (n.due.length > 10 ? n.due.slice(11, 16) : '今天'), html: '<div class="todo-item__main"><p>' + icon('bell', 14) + ' 「' + esc(n.title) + '」 <span class="tag tag--warning">今天</span></p></div>', action: '<button class="btn btn--ghost btn--sm" onclick="setTodoCat(this,\'reminder\')">去处理</button>' });
  });
  futureRem.forEach(function (n) {
    var d = (n.due || '').slice(0, 10);
    items.push({ _cat: remSubnavKey(n.cat), overdue: false, time: d.slice(5), html: '<div class="todo-item__main"><p>' + icon('bell', 14) + ' 「' + esc(n.title) + '」 <span class="tag tag--info">' + d.slice(5) + ' 待办</span></p></div>', action: '<button class="btn btn--ghost btn--sm" onclick="setTodoCat(this,\'reminder\')">去处理</button>' });
  });
  noDateRem.forEach(function (n) {
    items.push({ _cat: remSubnavKey(n.cat), overdue: false, time: '—', html: '<div class="todo-item__main"><p>' + icon('bell', 14) + ' 「' + esc(n.title) + '」 <span class="tag tag--neutral">未设时间</span></p></div>', action: '<button class="btn btn--ghost btn--sm" onclick="setTodoCat(this,\'reminder\')">去处理</button>' });
  });
  if (!pendRem.length) {
    items.push({ overdue: false, hint: true, html: '<div class="todo-item__main"><p>' + icon('bell', 14) + ' 暂无待办提醒</p></div>', action: '<button class="btn btn--ghost btn--sm" onclick="openReminderForm()">添加</button>' });
  }

  /* 风险 / 包月续费 提示 */
  var riskBoarding = boarding.filter(function (b) { return b.risk_flag && (b.status === 'boarding' || b.status === 'booked'); });
  if (riskBoarding.length) items.push({ overdue: true, time: '关注', html: '<div class="todo-item__main"><p>' + icon('warn', 14) + ' ' + riskBoarding.length + ' 个风险客户 <span class="tag tag--danger">关注</span></p></div>', action: '<button class="btn btn--ghost btn--sm" onclick="switchTab(\'boarding\')">查看</button>' });
  boarding.forEach(function (b) {
    if (!b.monthly || b.status !== 'boarding' || !b.checkout_expected) return;
    var diff = dateDiffDays(today, b.checkout_expected);
    /* V48p：包月到期只提醒「3 天内 + 已拖欠」，不再提前 7 天（老板口径：经营提示=3天内和已拖欠） */
    if (diff <= 3) items.push({ overdue: diff < 0, time: b.checkout_expected.slice(5), html: '<div class="todo-item__main"><p>' + icon('repeat', 14) + ' 「' + esc(b.pet_name) + '」包月到期 <span class="tag ' + (diff < 0 ? 'tag--danger' : 'tag--primary') + '">' + (diff < 0 ? '已超' + (-diff) + '天' : (diff === 0 ? '今天' : '剩 ' + diff + ' 天')) + '</span></p></div>', action: '<button class="btn btn--ghost btn--sm" onclick="openBoardingDetail(\'' + b.id + '\')">处理</button>' });
  });

  /* V43：今日提醒全量按时间排序（MM-DD 升序；无时间的提示/汇总项排最后） */
  items.sort(function (a, b2) {
    var ta = a.time || '99-99', tb = b2.time || '99-99';
    if (ta !== tb) return ta < tb ? -1 : 1;
    return (a._diff || 0) - (b2._diff || 0);
  });

  /* V56：防重复提醒——同一只狗在同一类提醒里只显示一次。
     历史多笔寄养（含同步产生的多份副本）会让同一只狗在"待收款/确认收款"等里反复出现，
     老板感知为"重复提醒"。按「狗名+提醒类别」去重，每类每只狗只保留最新的一条；
     news（事务提醒，含 icon('bell'）不参与按狗去重，避免误合并老板自建提醒。
     另：临时回家的"持久回店登记"与"当天接送"同属一只狗，只保留带接送动作的那条。 */
  (function () {
    function _pet(html) { var m = String(html || '').match(/「([^」]+)」/); return m ? m[1] : ''; }
    var _isNews = function (it) { return String(it.html || '').indexOf("icon('bell'") >= 0; };
    var _groups = {}, i, it, x, y, n2, ny, pk;
    for (i = 0; i < items.length; i++) {
      it = items[i];
      if (_isNews(it) || !it._cat) continue;
      var nm = _pet(it.html);
      if (!nm) continue;
      pk = nm + '|' + it._cat;
      (_groups[pk] = _groups[pk] || []).push(it);
    }
    var _keep = {};
    Object.keys(_groups).forEach(function (gk) {
      var arr = _groups[gk];
      if (arr.length === 1) { _keep[gk] = arr[0]; return; }
      arr.sort(function (a, b) {
        var ta = a.time || '', tb = b.time || '';
        if (ta !== tb) return ta < tb ? 1 : -1;            /* 日期新的优先 */
        return (b._diff || 0) - (a._diff || 0);            /* 同日期：更逾期优先 */
      });
      _keep[gk] = arr[0];
    });
    var _pickupPets = {};
    for (i = 0; i < items.length; i++) {
      x = items[i];
      if (x._cat === 'away-pickup' && !_isNews(x)) { n2 = _pet(x.html); if (n2) _pickupPets[n2] = 1; }
    }
    var _out = [];
    for (i = 0; i < items.length; i++) {
      y = items[i]; ny = _pet(y.html);
      if (ny && y._cat === 'away' && _pickupPets[ny]) continue;               /* 当天已有接送提醒，跳过持久回店登记 */
      if (ny && y._cat && _keep[ny + '|' + y._cat] && _keep[ny + '|' + y._cat] !== y) continue; /* 同类同狗只留最新 */
      _out.push(y);
    }
    items = _out;
  })();

  /* V37：忽略功能 —— 点「忽略」后永久不再显示（可在顶部一键恢复） */
  items.forEach(function (it) { it._key = todoKeyOf(it); });
  var ig = todoIgnoreMap();
  return items.filter(function (it) { return !ig[it._key]; });
}

/* ===== V37 待办忽略：永久忽略，不会自动回来；不动任何业务数据 ===== */
function todoIgnoreMap() {
  if (!meta || typeof meta !== 'object') return {};
  if (!meta.todoIgnored || typeof meta.todoIgnored !== 'object') meta.todoIgnored = {};
  return meta.todoIgnored;
}

  /* V43：日期类运营提醒（送狗回家/接狗/临时回家回店/洗澡/收款）把 time 纳入 key，
        避免「忽略某次」永久屏蔽同一只狗后续不同日期的同类提醒（糯米类场景） */
  if (it.time && (it._cat === 'checkout' || it._cat === 'checkin' || it._cat === 'away' || it._cat === 'bath' || it._cat === 'biz')) {

  persist(); renderAll();
  toast('已忽略，不会再提醒', 'info');
}

  var ig = todoIgnoreMap(), n = 0;
  Object.keys(ig).forEach(function (k) { if (ig[k]) n++; });
  return n;
}

  var n = todoIgnoredCount();
  if (n && !confirm('恢复已忽略的 ' + n + ' 条事项？')) return;
  var ig = todoIgnoreMap();
  Object.keys(ig).forEach(function (k) { delete ig[k]; });
  persist(); renderAll();
  toast('已恢复全部忽略的事项', 'success');
}

/* 包月洗澡上方：非包月/临时洗澡安排提醒（只在洗澡前 3 天 + 逾期显示） */

  if (!rows) {

function todoPanelHTML(items) {

function validateBoardingForm(rows, room, owner, phone, id) {
  document.querySelectorAll('#bf-dogs .input--error, #bf-room.input--error, #bf-owner.input--error, #bf-phone.input--error')
    .forEach(function (x) { x.classList.remove('input--error'); });
  /* V34b：登记卡所有字段均可空保存，不再强制必填——仅收集缺项做温和提醒，不拦截保存；
     唯一保留的物理上限：同住超员（一个房间塞太多狗）仍拦一下，避免数据乱套。 */
  var lack = [];
  for (var i = 0; i < rows.length; i++) {
    var row = rows[i], no = '狗狗 ' + (i + 1) + '：';
    var nameEl = row.querySelector('.bf-dog-name');
    if (!nameEl || !nameEl.value.trim()) lack.push(no + '宠物名');
    var breedEl = row.querySelector('.bf-dog-breed');
    if (!breedEl || !breedEl.value.trim()) lack.push(no + '品种');
    var ageEl = row.querySelector('.bf-dog-age');
    if (ageEl && !ageEl.value.trim()) lack.push(no + '年龄');
  }
  if (!owner) lack.push('主人姓名');
  if (!phone) lack.push('联系电话');
  /* V48n：房间号必填（老板要求）——没选房间直接拦截保存，避免产生无房间的"隐形记录"（如 2026-08-14 醒醒忘选房间） */
  if (!room) return bfFail(document.getElementById('bf-room'), '请选择房间号（必填），选好再保存');
  if (room) {
    var info = roomOccupancyInfo(room, _bfEditId);
    if (info.count + rows.length > ROOM_MAX_DOGS) {
      return bfFail(document.getElementById('bf-room'),
        '房间 ' + room + ' 已有 ' + info.count + ' 只（' + info.names + '），再加 ' + rows.length + ' 只超上限 ' + ROOM_MAX_DOGS + ' 只，请换房间');
    }
  }
  if (lack.length) toast('已保存（' + lack.slice(0, 4).join('、') + ' 未填，有空可补）');
  return true;

function monthlyTotal(days, monthlyFee) {
  /* 包月计费：整月按包月价，不足一月的零头按 包月价/30 × 实际剩余天数 */
  var full = Math.floor(days / 30);
  var rem = days - full * 30;
  return full * monthlyFee + (monthlyFee / 30) * rem;
}

  }

  if (id) { var _ob = boarding.find(function (x) { return x.id === id; }); if (_ob) _oldRoom = _ob.room_no || ''; }
  var isMem = document.querySelector('#bf-member') ? document.querySelector('#bf-member').checked : false;

  var pickupRem = v('#bf-pickup') || '';

  var base = {

    checkin_date: inDate, checkout_expected: outDate, room_no: room,

    book_channel: v('#bf-channel') || '', book_deposit: parseFloat(v('#bf-bookdeposit')) || 0,
    book_deposit_received: v('#bf-depstatus') || 'unreceived'
  };
  var sumFee = dogs.reduce(function (s, d) { return s + (d.daily_fee || 0); }, 0);
  function mk(rec) {
    var r = Object.assign({ id: uid(), status: 'booked', pickups: [], checkout_actual: '', createdAt: new Date().toISOString(), pet_age: '', pet_birth: '', pet_neutered: '是', diet_note: '', special_note: '' }, base, rec);
    r._t = Date.now();
    return r;
  }
  var _daysAll = Math.max(1, dateDiffDays(inDate, outDate) + 1);
  var effectiveTotal = total > 0 ? round2(total) : (monthly && monthlyFee > 0 ? round2(monthlyTotal(_daysAll, monthlyFee)) : round2(sumFee * _daysAll));
  if (id) {
    var b = boarding.find(function (x) { return x.id === id; });
    if (b) {
      Object.assign(b, base, dogs[0]);
      b.total_fee = effectiveTotal;
      touch(b);

/* 包月续住快捷键 + 接送提醒存为 pickup（Patch V） */

function monthlyExtend() {
  var outEl = document.getElementById('bf-out');
  var inEl = document.getElementById('bf-in');
  if (!outEl) return;
  var base = outEl.value || (inEl ? inEl.value : '') || todayStr();
  var start = new Date(base + 'T00:00:00');
  var d = new Date(start.getTime());
  d.setDate(d.getDate() + 30);
  function dim(y, m) { return new Date(y, m + 1, 0).getDate(); }
  var cross31 = false, crossFeb = false;
  var cur = new Date(start.getTime());
  while (cur <= d) {
    if (dim(cur.getFullYear(), cur.getMonth()) === 31) cross31 = true;
    if (cur.getMonth() === 1) crossFeb = true;
    cur.setDate(cur.getDate() + 1);
  }
  if (cross31) d.setDate(d.getDate() + 1);
  if (crossFeb) d.setDate(d.getDate() + 1);
  outEl.value = ymd(d);
  recalcTotal();
  toast('包月续住：退房设为 ' + outEl.value + '（30天' + (cross31 ? ' +1天(含31天月)' : '') + (crossFeb ? ' +1天(含二月)' : '') + '）');
}
function setReminder(rec, remTime) {

  if (remTime) {
    if (idx >= 0) rec.pickups[idx].scheduled_at = remTime;

function _stayEnd(b) { return b.checkout_expected || b.checkout_actual || (b.status === 'boarding' ? todayStr() : ''); }

/* ===== V38 长住/包月收款：交清或部分交清都能记，自动算欠款、自动记一笔收入 ===== */
function accrueToDate(b, upto) {
  if (!b || !b.checkin_date) return 0;
  var end = upto || todayStr();
  if (b.checkout_actual && b.checkout_actual < end) end = b.checkout_actual;
  if (b.checkout_expected && b.status !== 'boarding' && b.checkout_expected < end) end = b.checkout_expected;
  var days = Math.max(0, dateDiffDays(b.checkin_date, end) - (+b.away_days || 0));  /* 临时回家的天数不算钱 */
  var mf = +b.monthly_fee || 0, df = +b.daily_fee || 0;
  if (b.monthly && mf > 0) {
    var full = Math.floor(days / 30), rest = days % 30;
    return Math.round((full * mf + rest * df) * 100) / 100;
  }
  return Math.round(days * df * 100) / 100;
}
function paidTotal(b) { return (+((b || {}).deposit) || 0) + (+((b || {}).paid_amount) || 0); }
function oweOf(b, upto) { return Math.round((accrueToDate(b, upto) - paidTotal(b)) * 100) / 100; }
function oweTag(b) {
  if (!b || b.status === 'cancelled') return '';
  var o = oweOf(b);
  if (o > 0.5) return '<span class="tag tag--danger">欠 ' + money(o) + '</span>';
  if (o < -0.5) return '<span class="tag tag--blue">预存 ' + money(-o) + '</span>';
  return '';
}

  var days = Math.max(0, dateDiffDays(b.checkin_date || t, t) - (+b.away_days || 0));
  var basis = (b.monthly && +b.monthly_fee)
    ? ('包月 ' + money(b.monthly_fee) + '/月 · 已住 ' + days + ' 天（零头按日费 ' + money(b.daily_fee) + '）')

/* ===== 临时回家（可复用入住档案：常来常回的狗狗，一套资料反复用） ===== */
function tempHomeStatus(p) {
  if (!p || !p.stays || !p.stays.length) return { key: 'none', label: '待登记', cls: 'tag--neutral', sub: '' };
  var atFacility = boarding.some(function (b) { return b.pet_name === p.pet_name && b.status === 'boarding'; });
  if (atFacility) return { key: 'boarding', label: '在住', cls: 'tag--primary', sub: '当前在店' };
  var st = p.stays[p.stays.length - 1];
  var today = todayStr();
  if (st.back && today <= st.back) {
    var d = dateDiffDays(today, st.back);
    return { key: 'left', label: '已离开', cls: 'tag--info', sub: '距回店 ' + (d === 0 ? '今天' : d + ' 天') };
  }
  var over = st.back ? dateDiffDays(st.back, today) : 0;
  return { key: 'await', label: '待归来', cls: 'tag--danger', sub: st.back ? ('已超期 ' + over + ' 天') : '未填回店日' };
}
function renderTempHome() {
  var el = document.getElementById('tempHomeList');
  if (!el) return;
  var awayHtml = awayBlockHTML();
  if (!tempHome.length) {
    el.innerHTML = awayHtml + '<div class="empty-hint">在住的狗狗要临时回家：在「寄养管理」里点开那只狗的详情，就能点<b>临时回家</b>，房间会给他留着，回来点<b>回店</b>自动顺延到期日。<br>常来常回的老客也可以点右上「新增临时回家」建一份长期档案，下次回店一键复用资料。</div>';
    return;
  }
  el.innerHTML = awayHtml + tempHome.slice().sort(function (a, b) { return (b.createdAt || 0) - (a.createdAt || 0); }).map(function (p) {
    var s = tempHomeStatus(p);
    var latest = p.stays && p.stays.length ? p.stays[p.stays.length - 1] : null;
    var hist = (p.stays || []).map(function (st) {
      return '<li>' + (st.home || '—') + ' 回家 → 预计 ' + (st.back || '—') + ' 回店' + (st.next ? ' · 下次约 ' + st.next : '') + (st.note ? ' · ' + esc(st.note) : '') + '</li>';
    }).join('');
    return '<div class="th-card">' +
      '<div class="th-card__head"><span class="th-name">' + esc(p.pet_name) + '</span>' +
        '<span class="tag ' + s.cls + '">' + s.label + '</span>' +
        (s.sub ? '<span class="th-sub">' + s.sub + '</span>' : '') + '</div>' +
      '<div class="th-meta">' + (p.pet_breed ? '品种 ' + esc(p.pet_breed) + '　' : '') + (p.pet_age ? '年龄 ' + esc(p.pet_age) + '　' : '') + (p.owner_name ? '主人 ' + esc(p.owner_name) + '　' : '') + (p.room_no ? '常用房 ' + esc(p.room_no) : '') + '</div>' +
      (latest ? '<div class="th-cycle">本周期：' + (latest.home || '—') + ' 回家 · 预计 ' + (latest.back || '—') + ' 回店' + (latest.next ? ' · 下次约 ' + latest.next : '') + '</div>' : '') +
      '<div class="th-hist"><div class="th-hist__t">历史记录（' + (p.stays ? p.stays.length : 0) + '）</div><ul>' + (hist || '<li class="th-empty">暂无</li>') + '</ul></div>' +
      '<div class="th-actions">' +
        '<button class="btn btn--primary btn--sm" onclick="registerReturnFromTempHome(\'' + p.id + '\')">回店登记</button>' +
        '<button class="btn btn--secondary btn--sm" onclick="addHomeCycle(\'' + p.id + '\')">再次回家</button>' +
        '<button class="btn btn--ghost btn--sm" onclick="openTempHomeForm(\'' + p.id + '\')">编辑</button>' +
        '<button class="btn btn--ghost btn--sm" onclick="deleteTempHome(\'' + p.id + '\')">删除</button>' +
      '</div>' +
    '</div>';
  }).join('');
}
function openTempHomeForm(id) {
  var p = id ? tempHome.find(function (x) { return x.id === id; }) : null;
  var latest = p && p.stays && p.stays.length ? p.stays[p.stays.length - 1] : null;
  /* V42：老顾客名下拉（与寄养表单同源），选了自动带出基本资料 */
  var thDogListHtml = (function () {
    var ns = knownDogProfiles().map(function (x) { return String(x.pet_name || ''); }).filter(function (n, i, a) { return n && a.indexOf(n) === i; });
    return '<datalist id="thDogList">' + ns.map(function (n) { return '<option value="' + esc(n) + '">'; }).join('') + '</datalist>';
  })();
  openModal({
    title: p ? '编辑临时回家 · ' + p.pet_name : '新增临时回家',
    wide: true,
    content:
      '<div class="form-grid form-grid--2">' +
        field('狗狗名字', '<input class="input" id="th-name" list="thDogList" value="' + (p ? esc(p.pet_name) : '') + '" placeholder="如 旺财" autocomplete="off" onchange="thDogNameCommit(this)">') +
        field('品种', '<input class="input" id="th-breed" value="' + (p ? esc(p.pet_breed || '') : '') + '" placeholder="如 金毛">') +
        field('年龄', '<input class="input" id="th-age" value="' + (p ? esc(p.pet_age || '') : '') + '" placeholder="如 3岁">') +
        field('常用房间', '<input class="input" id="th-room" value="' + (p ? esc(p.room_no || '') : '') + '" placeholder="如 D15">') +
        field('主人姓名', '<input class="input" id="th-owner" value="' + (p ? esc(p.owner_name || '') : '') + '" placeholder="方便回店复用">') +
        field('联系电话', '<input class="input" id="th-phone" value="' + (p ? esc(p.owner_phone || '') : '') + '" placeholder="方便回店复用">') +
      '</div>' +
      '<h4 class="sub-title">本次回家周期</h4>' +
      '<div class="form-grid form-grid--3">' +
        field('本次回家日期', '<input type="date" class="input" id="th-home" value="' + (latest ? latest.home : todayStr()) + '">') +
        field('预计离开日期(回店)', '<input type="date" class="input" id="th-back" value="' + (latest ? latest.back : '') + '">') +
        field('下次预计回来日期', '<input type="date" class="input" id="th-next" value="' + (latest ? latest.next : '') + '">') +
      '</div>' +
      field('备注', '<input class="input" id="th-note" value="' + (latest ? esc(latest.note || '') : '') + '" placeholder="如 延13天 / 鲜食">') + thDogListHtml,
    footer: '<button class="btn btn--secondary" onclick="closeModal()">取消</button><button class="btn btn--primary" onclick="saveTempHome(\'' + (id || '') + '\')">保存</button>'
  });
}
function saveTempHome(id) {
  var name = v('#th-name').trim();
  if (!name) { toast('请填写狗狗名字', 'error'); return; }
  var cycle = { home: v('#th-home') || todayStr(), back: v('#th-back') || '', next: v('#th-next') || '', note: v('#th-note').trim(), createdAt: Date.now() };
  if (id) {
    var p = tempHome.find(function (x) { return x.id === id; });
    if (p) {
      p.pet_name = name; p.pet_breed = v('#th-breed').trim(); p.pet_age = v('#th-age').trim();
      p.room_no = v('#th-room').trim(); p.owner_name = v('#th-owner').trim(); p.owner_phone = v('#th-phone').trim();
      if (!p.stays) p.stays = [];
      var latest = p.stays[p.stays.length - 1];
      if (latest) { latest.home = cycle.home; latest.back = cycle.back; latest.next = cycle.next; latest.note = cycle.note; }
      else p.stays.push(cycle);
      logOp('编辑临时回家', name);
    }
  } else {
    tempHome.push({
      id: uid(), pet_name: name, pet_breed: v('#th-breed').trim(), pet_age: v('#th-age').trim(),
      room_no: v('#th-room').trim(), owner_name: v('#th-owner').trim(), owner_phone: v('#th-phone').trim(),
      stays: [cycle], createdAt: Date.now()
    });
    logOp('新增临时回家', name);
  }
  persist(); renderAll(); closeModal();
  toast(id ? '已更新临时回家资料' : '已新增临时回家资料');
}
function deleteTempHome(id) {
  var p = tempHome.find(function (x) { return x.id === id; });
  if (!p) return;
  confirmDialog({ title: '删除临时回家', message: '确认删除「' + p.pet_name + '」的临时回家档案？历史记录一并移除。', danger: true, confirmText: '删除',
    onConfirm: function () { tempHome = tempHome.filter(function (x) { return x.id !== id; }); markDeleted('tempHome', id); persist(); pushDeleteNow(); renderAll(); toast('已删除临时回家档案'); } });
}
/* V42：临时回家表单——选老顾客名自动带出基本资料（与寄养表单同源） */
function thDogNameCommit(el) {
  if (!el) return;
  var nm = String(el.value || '').trim().toLowerCase();
  if (!nm) return;
  var exact = knownDogProfiles().filter(function (p) { return String(p.pet_name).toLowerCase() === nm; });
  if (exact.length !== 1) return;
  var p = exact[0];
  function set(id, val) { var e = document.getElementById(id); if (e && val && !String(e.value || '').trim()) e.value = val; }
  set('th-breed', p.pet_breed); set('th-age', p.pet_age); set('th-room', p.room_no); set('th-owner', p.owner_name); set('th-phone', p.owner_phone);
  toast('已带出「' + p.pet_name + '」的老资料', 'success');
}
function registerReturnFromTempHome(id) {
  var p = tempHome.find(function (x) { return x.id === id; });
  if (!p) return;
  /* 复用资料：打开新建寄养表单并预填狗狗名字/品种/年龄/主人，回店免重复录入 */
  openBoardingForm('', p.room_no || '', { pet_name: p.pet_name, pet_breed: p.pet_breed || '', pet_gender: '', size: '', daily_fee: 0, vaccine_status: '', pet_age: p.pet_age || '', pet_birth: '' });
  setTimeout(function () {
    var o = document.getElementById('bf-owner'); if (o) o.value = p.owner_name || '';
    var ph = document.getElementById('bf-phone'); if (ph) ph.value = p.owner_phone || '';
  }, 0);
  toast('已打开寄养登记，狗狗资料已带好，补全入住日即可保存');
}
function addHomeCycle(id) {
  var p = tempHome.find(function (x) { return x.id === id; });
  if (!p) return;
  if (!p.stays) p.stays = [];
  p.stays.push({ home: todayStr(), back: '', next: '', note: '', createdAt: Date.now() });
  persist(); renderAll();
  openTempHomeForm(id);
  toast('已新建一个回家周期，请补全日期');
}

/* ---- 房间详情 ---- */
function openRoomDetail(roomNo) {
  var st = roomState(roomNo);
  var cls = st.state === 'occupied' ? 'tag--primary' : st.state === 'booked' ? 'tag--info' : st.state === 'cleaning' ? 'tag--warning' : 'tag--neutral';
  var anyUnpaid = st.recs.some(function (x) { return !paidUpOn(x, todayStr()); });
  var content = '<div class="room-detail__no">房间 ' + roomNo + '</div>' +
    '<div class="room-detail__state"><span class="tag ' + cls + '">' + ROOM_STATE_LABEL[st.state] + '</span></div>';
  if (st.recs.length > 1) {
    content += '<p style="margin:6px 0;font-size:13px;color:#b06a00;background:#fff7e6;padding:6px 10px;border-radius:8px">' + icon('users', 14) +
      ' 本房共 ' + st.recs.length + ' 只狗狗 · 同一家庭一起结账（第2只起半价），点任意一只的「标记已付」即整间一起结清</p>';
  }
  if (st.recs.length) {
    st.recs.forEach(function (b) {
      content += '<div class="room-detail__rec">' +
        '<p><b>「' + esc(b.pet_name) + '」</b> ' + esc(b.pet_breed || '') + ' · ' + (b.size ? esc(b.size) + ' · ' : '') + B_STATUS[b.status] +
          (b.risk_flag ? ' · <span class="tag tag--danger">风险</span>' : '') + (b.monthly ? ' · 包月' : '') + '</p>' +
        '<p>' + b.checkin_date + ' → ' + b.checkout_expected + (b.checkout_actual ? '（已退 ' + b.checkout_actual + '）' : '') +
          ' · <span class="tag ' + payTag(b.payment_status) + '">' + payLabel(b.payment_status) + '</span></p>' +
        '<p>主人：' + esc(b.owner_name || '') + ' ' + esc(b.owner_phone || '') + '</p>' +
        '<div class="card-actions">' +
          (b.status === 'boarding' && isAway(b)
            ? '<button class="btn btn--primary btn--sm" onclick="closeModal();openTempBackForm(\'' + b.id + '\')">回店登记</button>'
            : (b.status === 'boarding'
              ? '<button class="btn btn--secondary btn--sm" onclick="closeModal();openTempOutForm(\'' + b.id + '\')">临时回家</button>'
              : '')) +
          '<button class="btn btn--primary btn--sm" onclick="closeModal();setPayment(\'' + b.id + '\',\'' + (b.payment_status === 'paid' || b.payment_status === 'prestored' ? 'unpaid' : 'paid') + '\')">' + (b.payment_status === 'paid' || b.payment_status === 'prestored' ? '改未付' : '标记已付') + '</button>' +
          '<button class="btn btn--ghost btn--sm" onclick="closeModal();openBoardingDetail(\'' + b.id + '\')">打开「' + esc(b.pet_name) + '」记录</button>' +
          '<button class="btn btn--secondary btn--sm" onclick="closeModal();openBoardingForm(\'' + b.id + '\')">编辑</button></div>' +
      '</div>';
    });
  }
  content += '<div class="card-actions">' +
    (st.recs.length
      ? (anyUnpaid
        ? '<button class="btn btn--primary btn--sm" onclick="closeModal();markRoomPayment(\'' + roomNo + '\',\'paid\')">整间房标记已付（' + st.recs.length + '只）</button>'
        : '<button class="btn btn--secondary btn--sm" onclick="closeModal();markRoomPayment(\'' + roomNo + '\',\'unpaid\')">整间房改未付</button>')
      : '') +
    '<button class="btn btn--secondary btn--sm" onclick="closeModal();openBoardingForm(\'\',\'' + roomNo + '\')">登记入住（房间 ' + roomNo + '）</button>' +
    '<button class="btn btn--secondary btn--sm" onclick="toggleRoomClean(\'' + roomNo + '\')">' + (st.state === 'cleaning' ? '完成打扫' : '标记打扫中') + '</button></div>';
  openModal({ title: '房间 ' + roomNo, content: content });
}
function toggleRoomClean(roomNo) {
  var arr = meta.roomsCleaning || (meta.roomsCleaning = []);
  var i = arr.indexOf(roomNo);
  if (i >= 0) arr.splice(i, 1); else arr.push(roomNo);
  persist(); renderAll(); closeModal();
  toast(i >= 0 ? '房间 ' + roomNo + ' 打扫完成' : '房间 ' + roomNo + ' 已标记打扫中');
}

/* ================= 模块 B：财务中心 ================= */
function renderFinance() {
  var m = currentMonth();
  var inc = transactions.filter(function (t) { return t.type === 'income' && t.date.indexOf(m) === 0; })
    .reduce(function (s, t) { return s + (+t.amount || 0); }, 0);
  var exp = bizExpenseIn(m); /* 乐园经营支出（已剔除「其他」个人消费） */
  var per = personalIn(m);   /* 老板个人消费，不计入乐园 */
  var rec = transactions.filter(function (t) { return t.type === 'receivable' && t.date.indexOf(m) === 0; }).reduce(function (s, t) { return s + (+t.amount || 0); }, 0);
  var sal = monthlySalary(m);
  document.getElementById('financeStats').innerHTML =
    '<div class="card stat-card stat-card--click" onclick="drill(\'f-inc\')"><div class="stat-icon stat-icon--income">' + icon('money', 20) + '</div>' +
      '<div class="stat-info"><div class="stat-label">本月收入</div><div class="stat-value stat-value--income">' + money(inc) + '</div></div><div class="stat-go">查看明细 ›</div></div>' +
    '<div class="card stat-card stat-card--click" onclick="drill(\'f-exp\')"><div class="stat-icon stat-icon--expense">' + icon('money', 20) + '</div>' +
      '<div class="stat-info"><div class="stat-label">本月支出（乐园）</div><div class="stat-value stat-value--expense">' + money(exp) + '</div><div class="stat-sub">不含个人消费</div></div><div class="stat-go">查看明细 ›</div></div>' +
    '<div class="card stat-card stat-card--click" onclick="drill(\'f-net\')"><div class="stat-icon">' + icon('chart', 20) + '</div>' +
      '<div class="stat-info"><div class="stat-label">本月净利（扣工资）</div><div class="stat-value stat-value--net">' + money(inc - exp - sal) + '</div><div class="stat-sub">毛利 ' + money(inc - exp) + ' · 工资 ' + money(sal) + '</div></div><div class="stat-go">查看明细 ›</div></div>' +
    '<div class="card stat-card stat-card--click" onclick="drill(\'f-rec\')"><div class="stat-icon">' + icon('money', 20) + '</div>' +
      '<div class="stat-info"><div class="stat-label">本月应收</div><div class="stat-value stat-value--net">' + money(rec) + '</div><div class="stat-sub">' + m + '</div></div><div class="stat-go">查看明细 ›</div></div>' +
    '<div class="card stat-card stat-card--click" onclick="drill(\'f-personal\')"><div class="stat-icon">' + icon('users', 20) + '</div>' +
      '<div class="stat-info"><div class="stat-label">我的个人消费</div><div class="stat-value" style="color:#8B5CF6">' + money(per) + '</div><div class="stat-sub">类目「其他」· 不计入乐园账</div></div><div class="stat-go">查看明细 ›</div></div>';
  renderDonut(m);
  renderBarChart();
  renderExpCompare();
  renderTxList();
  renderEmployees();
  renderSalarySection();
  renderMembers();

  renderMemberOverview();
  renderYearCompare();
  renderMultiCompare();
}
function renderDonut(month) {
  var mode = donutMode;
  var cats = txCatsByType(mode, month); /* 动态取实际存在的类目（支出自动剔除个人消费），不再用固定白名单漏算 */
  var totals = cats.map(function (c) {
    return transactions.filter(function (t) { return t.type === mode && t.category === c && t.date.indexOf(month) === 0; })
      .reduce(function (s, t) { return s + (+t.amount || 0); }, 0);
  });
  var total = totals.reduce(function (a, b) { return a + b; }, 0);
  var data = cats.map(function (c, i) { return { label: c, value: totals[i], color: PALETTE[i % PALETTE.length] }; })
    .filter(function (d) { return d.value > 0; });
  var size = 190, stroke = 30, r = (size - stroke) / 2, c = size / 2, circ = 2 * Math.PI * r;
  var rings = '<circle cx="' + c + '" cy="' + c + '" r="' + r + '" fill="none" stroke="#F3F4F6" stroke-width="' + stroke + '"/>';
  var off = 0;
  data.forEach(function (d) {
    var len = circ * d.value / total;
    rings += '<circle cx="' + c + '" cy="' + c + '" r="' + r + '" fill="none" stroke="' + d.color + '" stroke-width="' + stroke + '" stroke-dasharray="' + len.toFixed(2) + ' ' + circ.toFixed(2) + '" stroke-dashoffset="' + (-off).toFixed(2) + '" transform="rotate(-90 ' + c + ' ' + c + ')"/>';
    off += len;
  });
  var legend = data.length ? data.map(function (d) {
    return '<li style="cursor:pointer" title="点击看「' + d.label + '」全部明细" onclick="drillDonutCat(\'' + mode + '\',\'' + d.label + '\',\'' + month + '\')"><i style="background:' + d.color + '"></i><span>' + d.label + '</span><b>' + money(d.value) + '</b></li>';
  }).join('') : '<li class="dim">本月暂无' + (mode === 'income' ? '收入' : '支出') + '记录</li>';
  document.getElementById('donutChart').innerHTML =
    '<div class="donut"><svg viewBox="0 0 ' + size + ' ' + size + '" width="' + size + '" height="' + size + '">' + rings +
      '<text x="' + c + '" y="' + (c - 2) + '" text-anchor="middle" font-size="13" fill="#9CA3AF">' + (mode === 'income' ? '收入' : '支出') + '</text>' +
      '<text x="' + c + '" y="' + (c + 18) + '" text-anchor="middle" font-size="17" font-weight="700" fill="#1F2937">' + money(total) + '</text>' +
    '</svg></div><ul class="donut-legend">' + legend + '</ul>';
  var btns = document.querySelectorAll('#donutSeg .seg__btn');
  for (var i = 0; i < btns.length; i++) btns[i].classList.toggle('active', btns[i].getAttribute('data-mode') === mode);
}
function renderBarChart() {
  var days = [], map = {}, i;
  for (i = 29; i >= 0; i--) { var d = new Date(); d.setDate(d.getDate() - i); days.push(fmtDate(d)); }
  days.forEach(function (d) { map[d] = { income: 0, expense: 0 }; });
  transactions.forEach(function (t) { if (isPersonalTx(t)) return; /* 个人消费不进乐园走势图 */ if (map[t.date] && map[t.date][t.type] !== undefined) map[t.date][t.type] += (+t.amount || 0); });
  var max = 1;
  days.forEach(function (d) { max = Math.max(max, map[d].income, map[d].expense); });
  var W = 640, H = 200, PL = 36, PR = 10, PT = 12, PB = 24;
  var iw = W - PL - PR, ih = H - PT - PB;
  var slot = iw / days.length;
  var bw = Math.max(4, Math.min(10, slot * 0.26));
  var grid = '', bars = '', labels = '';
  for (i = 0; i <= 3; i++) {
    var y = PT + ih - (ih * i / 3), val = max * i / 3;
    grid += '<line x1="' + PL + '" y1="' + y + '" x2="' + (W - PR) + '" y2="' + y + '" stroke="#F3F4F6"/>';
    grid += '<text x="' + (PL - 6) + '" y="' + (y + 3) + '" text-anchor="end" font-size="9" fill="#9CA3AF">' + (val >= 1000 ? (Math.round(val / 1000)) + 'k' : Math.round(val)) + '</text>';
  }
  days.forEach(function (d, idx) {
    var x = PL + slot * idx + slot / 2;
    var hi = (map[d].income / max) * ih, he = (map[d].expense / max) * ih;
    if (map[d].income > 0) bars += '<rect x="' + (x - bw - 1.5) + '" y="' + (PT + ih - hi) + '" width="' + bw + '" height="' + hi + '" rx="2" fill="#16A34A"/>';
    if (map[d].expense > 0) bars += '<rect x="' + (x + 1.5) + '" y="' + (PT + ih - he) + '" width="' + bw + '" height="' + he + '" rx="2" fill="#EF4444"/>';
    if (idx % 4 === 0) labels += '<text x="' + x + '" y="' + (H - 8) + '" text-anchor="middle" font-size="9" fill="#9CA3AF">' + d.slice(5) + '</text>';
  });
  document.getElementById('barChart').innerHTML =
    '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="近30天收支柱状图">' + grid + bars + labels + '</svg>' +

/* V53：记账关联收款：把「记一笔」收入同步进寄养记录的付款状态，让房间颜色随之变化。
   以 pay_log 中 src='tx:<id>' 为锚点，增量更新 paid_amount，编辑/换狗/删除都安全不重复。 */
function applyLinkedPayment(txId, bid) {
  var b = boarding.find(function (x) { return x.id === bid; });
  if (!b) return;
  var t = transactions.find(function (x) { return x.id === txId; });
  if (!b.pay_log) b.pay_log = [];
  var exist = null;
  for (var i = 0; i < b.pay_log.length; i++) { if (b.pay_log[i].src === 'tx:' + txId) { exist = b.pay_log[i]; break; } }
  var oldAmt = exist ? (+exist.amt || 0) : 0;
  var newAmt = (t && t.type === 'income') ? (+t.amount || 0) : 0;
  b.paid_amount = Math.round(((+b.paid_amount || 0) + (newAmt - oldAmt)) * 100) / 100;
  b.pay_log = b.pay_log.filter(function (p) { return p.src !== 'tx:' + txId; });
  if (newAmt > 0) b.pay_log.push({ date: t.date, amt: newAmt, method: '记账', note: (t.remark || ''), src: 'tx:' + txId });
  var owe = oweOf(b);
  b.payment_status = owe <= 0.5 ? (owe < -0.5 ? 'prestored' : 'paid') : 'partial';
  if (owe <= 0.5 && b.risk_flag) b.risk_flag = false;
  touch(b);
}
function revertLinkedPayment(bid, txId) {
  var b = boarding.find(function (x) { return x.id === bid; });
  if (!b || !b.pay_log) return;
  var exist = null;
  for (var i = 0; i < b.pay_log.length; i++) { if (b.pay_log[i].src === 'tx:' + txId) { exist = b.pay_log[i]; break; } }
  if (!exist) return;
  b.paid_amount = Math.round(((+b.paid_amount || 0) - (+exist.amt || 0)) * 100) / 100;
  b.pay_log = b.pay_log.filter(function (p) { return p.src !== 'tx:' + txId; });
  var owe = oweOf(b);
  b.payment_status = owe <= 0.5 ? (owe < -0.5 ? 'prestored' : 'paid') : 'partial';
  touch(b);
}

/* V39b：支出分类对比（按年月，剔除个人消费）—— 横向条形图：所选月 vs 上月/去年同期 */
var expCmp = { m: currentMonth(), base: 'prev' };
function expCmpMonthOptions() {
  var opts = [], now = new Date(), y = now.getFullYear(), mo = now.getMonth();
  for (var i = 0; i < 24; i++) {
    var d = new Date(y, mo - i, 1);
    var v = d.getFullYear() + '-' + pad2(d.getMonth() + 1);
    opts.push('<option value="' + v + '"' + (v === expCmp.m ? ' selected' : '') + '>' + v + '</option>');
  }
  return opts.join('');
}
function setExpCmp(k, v) { expCmp[k] = v; renderExpCompare(); }
function expCmpBaseMonth() {
  var ym = expCmp.m;
  if (expCmp.base === 'ly') return lastYearMonth(ym);
  var p = ym.split('-'), yy = +p[0], mm = +p[1] - 1;
  if (mm < 1) { mm = 12; yy--; }
  return yy + '-' + pad2(mm);
}
function expCmpSum(ym, cat) {
  return transactions.filter(function (t) {
    return t.type === 'expense' && t.category === cat && String(t.date || '').indexOf(ym) === 0 && isBizExpense(t);
  }).reduce(function (s, t) { return s + (+t.amount || 0); }, 0);
}
function renderExpCompare() {
  var el = document.getElementById('expCompareChart');
  if (!el) return;
  var sel = document.getElementById('expCmpMonth');
  if (sel && !sel.innerHTML) sel.innerHTML = expCmpMonthOptions();
  var cur = expCmp.m, base = expCmpBaseMonth();
  var rows = txCatsByType('expense', null).map(function (c) { return { cat: c, cur: expCmpSum(cur, c), base: expCmpSum(base, c) }; })
    .filter(function (r) { return r.cur > 0 || r.base > 0; })
    .sort(function (a, b) { return b.cur - a.cur; });
  var max = 1;
  rows.forEach(function (r) { max = Math.max(max, r.cur, r.base); });
  var tCur = rows.reduce(function (s, r) { return s + r.cur; }, 0);
  var tBase = rows.reduce(function (s, r) { return s + r.base; }, 0);
  function bar(v, isBase) {
    var w = Math.max(1.5, Math.round(v / max * 100));
    return '<div class="expcmp__bar' + (isBase ? ' expcmp__bar--base' : '') + '"><i style="width:' + w + '%"></i></div>';
  }
  function delta(cv, bv) {
    if (bv <= 0 && cv <= 0) return '<span class="expcmp__d expcmp__d--none">—</span>';
    if (bv <= 0) return '<span class="expcmp__d expcmp__d--up">新增 +' + money(cv) + '</span>';

  }
  if (!rows.length) { el.innerHTML = '<div class="empty--sm">所选月份没有经营支出记录（个人消费不计入）</div>'; return; }
  var html = '<div class="expcmp">' +
    '<div class="expcmp__row expcmp__row--head"><span class="expcmp__name">类目</span>' +
      '<div class="expcmp__bars"><span class="expcmp__bar-lbl expcmp__bar-lbl--cur">' + cur + '（橙）</span><span class="expcmp__bar-lbl expcmp__bar-lbl--base">' + base + '（灰）</span></div>' +
      '<span class="expcmp__amt">金额</span><span class="expcmp__d">增减</span></div>' +
    rows.map(function (r) {
      return '<div class="expcmp__row" title="' + esc(r.cat) + '：' + cur + ' ' + money(r.cur) + ' · ' + base + ' ' + money(r.base) + '">' +
        '<span class="expcmp__name">' + esc(r.cat) + '</span>' +
        '<div class="expcmp__bars">' + bar(r.cur, false) + bar(r.base, true) + '</div>' +

function potentialMembers() {

  var byKey = {};
  boarding.forEach(function (b) {
    var key = (b.owner_name || b.pet_name || '').trim(); if (!key) return;
    if (!byKey[key]) byKey[key] = { name: key, phone: b.owner_phone || '', monthly: false, count: 0, last: '' };
    var o = byKey[key]; o.count++;
    if (b.monthly) o.monthly = true;
    if ((b.checkout_expected || '') > o.last) o.last = b.checkout_expected;
  });
  var res = [];

    var o = byKey[k];
    if (seen[k]) return;
    if (o.monthly || o.count >= 2) res.push(o);
  });
  return res.sort(function (a, b) { return b.count - a.count; });
}

function logCommission(emp, month, oldRec, newRec) {

    ['deep_clean', '深度清洁'], ['bath', '洗澡提成'], ['care', '护理提成'], ['good_review', '好评奖励'], ['boarding_award', '寄养达标奖']
  ];

function reminderById(id) { return news.find(function (x) { return x.id === id; }); }
function remStatusOf(r, today) {
  if (r.done) return 'done';
  if (!r.due) return 'normal';

  if (r.due.slice(0, 10) === today) return 'today';
  return 'upcoming';
}
function renderReminders() {
  var today = todayStr();

  if (reminderFilter === 'pending') list = list.filter(function (n) { return !n.done; });
  else if (reminderFilter === 'done') list = list.filter(function (n) { return n.done; });
  else if (reminderFilter === 'pinned') list = list.filter(function (n) { return n.pinned; });
  else if (reminderFilter === 'overdue') list = list.filter(function (n) { return !n.done && n.due && n.due < today; });
  else if (reminderFilter === 'today') list = list.filter(function (n) { return !n.done && n.due && n.due.slice(0, 10) === today; });
  /* V39d：已归对应板块的提醒（洗澡→近期洗澡/接送→接狗入园/收款→财务流水上方）不再重复列在事务提醒，
     只有专门点该分类筛选时才显示 */
  if (remCatFilter === 'all') list = list.filter(function (n) { return ['洗澡', '接送', '收款'].indexOf(n.cat || '') < 0; });
  if (remCatFilter !== 'all') list = list.filter(function (n) { return (n.cat || '通用') === remCatFilter; });
  if (reminderSearch) {
    var q = reminderSearch.toLowerCase();
    list = list.filter(function (n) { return ((n.title || '') + ' ' + (n.note || '')).toLowerCase().indexOf(q) >= 0; });
  }
  list.sort(function (a, b) {
    var ap = a.pinned ? 1 : 0, bp = b.pinned ? 1 : 0;
    if (ap !== bp) return bp - ap;
    var ad = a.done ? 1 : 0, bd = b.done ? 1 : 0;
    if (ad !== bd) return ad - bd;
    var ak = a.due || '9999', bk = b.due || '9999';
    if (ak !== bk) return ak < bk ? -1 : 1;
    return (b.createdAt || '').localeCompare(a.createdAt || '');
  });
  var el = document.getElementById('remList');
  if (!el) return;
  syncRemSubnav();
  if (!list.length) {
    el.innerHTML = '<div class="empty">' + icon('bell', 64) + '<div class="empty__title">暂无提醒</div><div class="empty__desc">点击「添加提醒」记录待办，可置顶、设到期时间</div></div>';
    syncRemSubnav();
    return;
  }
  el.innerHTML = list.map(function (n) {
    var st = remStatusOf(n, today);
    var badge = st === 'overdue' ? '<span class="tag tag--danger">已逾期</span>'
      : st === 'today' ? '<span class="tag tag--warning">今天到期</span>'
      : st === 'upcoming' ? '<span class="tag tag--info">待到期</span>'
      : st === 'done' ? '<span class="tag tag--neutral">已完成</span>'
      : '<span class="tag tag--neutral">无期限</span>';
    var dueText = n.due ? (n.due.length > 10 ? n.due.replace('T', ' ') : n.due) : '—';
    var isBath = (n.cat === '洗澡');
    var catTag = n.cat ? ' <span class="tag tag--info">' + esc(n.cat) + '</span>' : '';
    var bathRow = '';
    if (isBath) {
      var bc = bathCountdown(n, today);
      bathRow = '<div class="rem-bath">' +
        '<span class="rem-bath__cd ' + bc.cls + '">' + bc.text + '</span>' +
        (n.interval ? '<span class="rem-bath__iv">周期 ' + n.interval + ' 天</span>' : '') +
        '<span class="rem-bath__push">拖后 ' +
          '<button class="btn btn--ghost btn--xs" onclick="pushReminderDue(\'' + n.id + '\',1)">+1</button>' +
          '<button class="btn btn--ghost btn--xs" onclick="pushReminderDue(\'' + n.id + '\',3)">+3</button>' +
          '<button class="btn btn--ghost btn--xs" onclick="pushReminderDue(\'' + n.id + '\',7)">+7</button>' +
        '</span>' +
      '</div>';
    }
    return '<div class="card rem-card rem-card--' + st + (n.pinned ? ' rem-card--pinned' : '') + (isBath ? ' rem-card--bath' : '') + '">' +
      '<div class="rem-card__head">' +
        (n.pinned ? '<span class="rem-pin" title="已置顶">' + icon('pin', 14) + '</span>' : '') +
        '<span class="rem-card__title' + (n.done ? ' is-done' : '') + '">' + esc(n.title) + '</span>' + catTag +
        '<div class="rem-card__actions">' +
          '<button class="btn btn--ghost btn--sm" onclick="togglePin(\'' + n.id + '\')" title="置顶/取消置顶">' + icon('pin', 14) + '</button>' +
          '<button class="btn btn--ghost btn--sm" onclick="openReminderForm(\'' + n.id + '\')">' + icon('edit', 14) + '</button>' +
          '<button class="btn btn--danger-ghost btn--sm" onclick="deleteReminder(\'' + n.id + '\')">' + icon('trash', 14) + '</button>' +
        '</div>' +
      '</div>' +
      (n.note ? '<p class="rem-card__note">' + esc(n.note).replace(/\n/g, '<br>') + '</p>' : '') +
      bathRow +
      '<div class="rem-card__meta">' +
        '<span>到期：' + dueText + '</span>' + badge +

      '</div>' +
    '</div>';
  }).join('');

  var c = gtCfg();
  var url = 'https://gitee.com/api/v5/repos/' + encodeURIComponent(c.owner) + '/' + encodeURIComponent(c.repo) + '/contents/' + CLOUD_SNAP_DIR + '?access_token=' + encodeURIComponent(c.token);
  fetch(url).then(function (r) { if (!r.ok) return null; return r.json(); }).then(function (list) {
    if (!Array.isArray(list)) return;
    /* 只裁剪自动快照 park-*；手动存档 manual-* 与抢救存档 rescue-* 永不自动删除 */
    list = list.filter(function (it) { return it && typeof it.name === 'string' && it.name.indexOf('park-') === 0; });
    if (list.length <= SNAP_CLOUD_MAX) return;
    list.sort(function (a, b) { return a.name < b.name ? -1 : 1; });
    var toDel = list.slice(0, list.length - SNAP_CLOUD_MAX);
    toDel.forEach(function (item) {
      var delUrl = 'https://gitee.com/api/v5/repos/' + encodeURIComponent(c.owner) + '/' + encodeURIComponent(c.repo) + '/contents/' + CLOUD_SNAP_DIR + '/' + encodeURIComponent(item.name);
      fetch(delUrl, { method: 'DELETE', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ access_token: c.token, sha: item.sha, message: '清理旧快照' }) }).catch(function () {});
    });
  }).catch(function () {});
}
/* 手机端救命按钮：把本机数据原样存一份到云端存档，不覆盖主文件、不动任何数据。
   适用场景：人在外面、手机上刚录完一批，想立刻确保"这批东西丢不了"。 */
function backupNowToCloud() {
  if (!gtReady()) { toast('云端还没连上，先到「数据」→「多端同步」连接', 'error'); return; }
  var n = snapshotRealCount();
  if (!n) { toast('本机没有数据可存', 'error'); return; }
  try { takeSnapshot('手动存档'); } catch (e) { }
  toast('正在把本机 ' + n + ' 条数据存到云端…');
  var payload = '';
  try { payload = JSON.stringify(snapshotPayload()); } catch (e) { toast('打包失败：' + fmtErr(e), 'error'); return; }
  pushCloudSnapshot(payload, true, function (err) {
    if (err) toast('存档失败：' + err + '，请检查网络后重试', 'error');
    else toast('✅ 已存一份到云端存档（' + n + ' 条），不会覆盖任何数据', 'success');
  }, 'manual');
}
function listCloudSnapshots(cb) {
  if (!gtReady()) { cb('未填写仓库信息', []); return; }
  var c = gtCfg();
  var url = 'https://gitee.com/api/v5/repos/' + encodeURIComponent(c.owner) + '/' + encodeURIComponent(c.repo) + '/contents/' + CLOUD_SNAP_DIR + '?access_token=' + encodeURIComponent(c.token) + '&_t=' + Date.now();
  fetch(url, { method: 'GET', cache: 'no-store' }).then(function (r) {
    if (r.status === 404) { cb(null, []); return null; } // 目录还不存在
    if (!r.ok) return r.text().then(function (t) { cb('HTTP ' + r.status + '：' + String(t).slice(0, 120), []); return null; });
    return r.json().then(function (list) {
      var arr = (Array.isArray(list) ? list : []).map(function (it) { return { name: it.name, size: it.size || 0, sha: it.sha, path: it.path }; })
        .sort(function (a, b) { return a.name < b.name ? 1 : -1; }); // 新→旧
      cb(null, arr); return null;
    });
  }).catch(function (e) { cb('网络错误：' + fmtErr(e), []); });
}
function fetchCloudSnapshot(name, cb) {
  if (!gtReady()) { cb('未填写仓库信息', null); return; }
  var c = gtCfg();
  var url = 'https://gitee.com/api/v5/repos/' + encodeURIComponent(c.owner) + '/' + encodeURIComponent(c.repo) + '/contents/' + CLOUD_SNAP_DIR + '/' + encodeURIComponent(name) + '?access_token=' + encodeURIComponent(c.token) + '&_t=' + Date.now();
  fetch(url, { method: 'GET', cache: 'no-store' }).then(function (r) {
    if (!r.ok) return r.text().then(function (t) { cb('HTTP ' + r.status + '：' + String(t).slice(0, 120), null); return null; });
    return r.json().then(function (j) {
      var txt = b64dec(j && j.content || ''); var obj = null; try { obj = JSON.parse(txt); } catch (e) { obj = null; }
      cb(null, obj); return null;
    });
  }).catch(function (e) { cb('网络错误：' + fmtErr(e), null); });
}
/* 还原到某个快照（整段替换当前数据）——危险操作，调用方需先确认 + 先拍兜底快照 */
function applyRecoveryState(obj) {
  if (!obj) return;
  if (Array.isArray(obj.boarding)) boarding = obj.boarding;
  if (Array.isArray(obj.transactions)) transactions = obj.transactions;
  if (Array.isArray(obj.salary)) { salary = obj.salary; salary = dedupeSalaryArray(salary); }
  if (Array.isArray(obj.employees)) { employees = obj.employees; employees = dedupeEmployeesArray(employees); }
  if (Array.isArray(obj.members)) { members = obj.members; members = dedupeMembersArray(members); }
  if (obj.commConfig) commConfig = Object.assign(commConfig, obj.commConfig);
  if (Array.isArray(obj.posts)) posts = obj.posts;
  if (Array.isArray(obj.news)) news = obj.news;
  if (obj.meta) { var _s = meta.sync; meta = Object.assign(meta, obj.meta); meta.sync = _s; }
  meta.seeded = true;
  /* V48f：恢复后强制补这些标记，避免下次打开页面被 loadAll 的迁移守卫/重灌逻辑误清空（尤其事务提醒 news） */
  meta.reminderMigrated = true;
  meta.dataVersion = DATA_VERSION;
  persist(); renderAll();
}
function openRecoveryCenter() {
  openModal({
    title: '数据保险箱 · 恢复中心（时间机器）',
    wide: true,
    content:
      '<p class="hint">任何改动都会自动留底。这里列出所有能找回的备份，点「还原」即可回到那一时刻的数据（还原前会自动再留一份当前状态兜底）。</p>' +
      '<div class="data-actions" style="margin:6px 0 10px"><button class="btn btn--primary" style="width:100%" onclick="backupNowToCloud()">' + icon('shield', 16) + ' 立刻存一份到云端（安全，不覆盖任何数据）</button></div>' +
      '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin-top:8px">' +
        '<div style="border:1px solid #E5E7EB;border-radius:10px;padding:12px">' +
          '<div style="font-weight:600;margin-bottom:6px">' + icon('clock', 18) + ' 本机快照（浏览器内，最近 ' + SNAP_LOCAL_MAX + ' 份）</div>' +
          '<div id="recLocal" style="max-height:320px;overflow:auto"></div>' +
          '<button class="btn btn--secondary btn--sm" style="margin-top:8px" onclick="(function(){takeSnapshot(\'手动\');renderLocalSnapshots();toast(\'已留底本机快照\');})()">立即留一份本机快照</button>' +
        '</div>' +
        '<div style="border:1px solid #E5E7EB;border-radius:10px;padding:12px">' +
          '<div style="font-weight:600;margin-bottom:6px">' + icon('cloud', 18) + ' 云端历史快照（Gitee，最近 ' + SNAP_CLOUD_MAX + ' 份）</div>' +
          '<div id="recCloud" style="max-height:320px;overflow:auto"></div>' +
          '<button class="btn btn--secondary btn--sm" style="margin-top:8px" onclick="manualCloudSnapshot()">立即留一份云端快照</button>' +
        '</div>' +
      '</div>',
    footer: '<button class="btn btn--secondary" onclick="closeModal()">关闭</button>'
  });
  renderLocalSnapshots();
  renderCloudSnapshots();
}
function renderLocalSnapshots() {
  var el = document.getElementById('recLocal'); if (!el) return;
  var arr = listLocalSnapshots();
  if (!arr.length) { el.innerHTML = '<div style="color:#999;padding:10px;font-size:13px">暂无本机快照</div>'; return; }
  el.innerHTML = arr.map(function (s, i) {
    var d = new Date(s.ts);
    var dt = d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()) + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + ':' + pad2(d.getSeconds());
    var n = (s.data && s.data.boarding ? s.data.boarding.length : 0) + (s.data && s.data.transactions ? s.data.transactions.length : 0) + (s.data && s.data.members ? s.data.members.length : 0);
    return '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px;border-bottom:1px solid #F0F0F0">' +
      '<div><b>' + dt + '</b><span style="display:inline-block;background:#F0F4FF;color:#3B5BDB;font-size:11px;padding:1px 6px;border-radius:6px;margin-left:6px">' + esc(s.label || '自动') + '</span><br><span class="hint">约 ' + n + ' 条核心数据</span></div>' +
      '<div style="display:flex;gap:6px;flex-shrink:0"><button class="btn btn--ghost btn--sm" onclick="previewLocalSnapshot(' + i + ')">预览</button><button class="btn btn--primary btn--sm" onclick="restoreLocalSnapshot(' + i + ')">还原</button></div>' +
    '</div>';
  }).join('');
}
function previewLocalSnapshot(i) {
  var s = listLocalSnapshots()[i]; if (!s) return;
  var d = s.data || {};
  openModal({
    title: '本机快照预览 · ' + new Date(s.ts).toLocaleString('zh-CN'),
    content: recoveryStatsHtml(d),
    footer: '<button class="btn btn--secondary" onclick="closeModal()">关闭</button>'
  });
}
function restoreLocalSnapshot(i) {
  var s = listLocalSnapshots()[i]; if (!s) return;
  dangerGuard({
    title: '还原本机快照',
    message: '将用这份快照<b>替换当前全部数据</b>。当前数据会先自动留底，可再还原回来。',
    tip: '确认这是你要回到的那个时间点。',
    confirmText: '确认还原到该快照',
    onConfirm: function () { takeSnapshot('还原前'); applyRecoveryState(s.data); closeModal(); toast('已还原到本机快照 ✅'); }
  });
}
function recoveryStatsHtml(d) {
  return '<div class="data-stats">' +
    '<div class="data-stat"><b>' + (d.boarding || []).length + '</b><span>寄养</span></div>' +
    '<div class="data-stat"><b>' + (d.transactions || []).length + '</b><span>收支</span></div>' +
    '<div class="data-stat"><b>' + (d.members || []).length + '</b><span>会员</span></div>' +
    '<div class="data-stat"><b>' + (d.salary || []).length + '</b><span>工资</span></div>' +
    '<div class="data-stat"><b>' + (d.employees || []).length + '</b><span>员工</span></div>' +
    '<div class="data-stat"><b>' + (d.news || []).length + '</b><span>提醒</span></div>' +
    '<div class="data-stat"><b>' + (d.posts || []).length + '</b><span>推广</span></div>' +
    '</div>';
}
function renderCloudSnapshots() {
  var el = document.getElementById('recCloud'); if (!el) return;
  el.innerHTML = '<div style="color:#999;padding:10px;font-size:13px">读取中…</div>';
  if (!gtReady()) { el.innerHTML = '<div style="color:#999;padding:10px;font-size:13px">请先在「数据」→「多端同步」填写仓库信息</div>'; return; }
  listCloudSnapshots(function (err, list) {
    if (!el) return;
    if (err) { el.innerHTML = '<div style="color:#E5484D;padding:10px;font-size:13px">' + esc(err) + '</div>'; return; }
    if (!list.length) { el.innerHTML = '<div style="color:#999;padding:10px;font-size:13px">云端暂无历史快照（每次同步会自动生成）</div>'; return; }
    el.innerHTML = list.map(function (it) {
      var stamp = (it.name || '').replace(/^park-/, '').replace(/\.json$/, '');
      var dt = stamp.replace(/(\d{4})(\d{2})(\d{2})-(\d{2})(\d{2})(\d{2})/, function (_, y, mo, d, h, mi, s) { return y + '-' + mo + '-' + d + ' ' + h + ':' + mi + ':' + s; });
      var kb = it.size ? Math.max(1, Math.round(it.size / 1024)) + ' KB' : '';
      return '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px;border-bottom:1px solid #F0F0F0">' +
        '<div><b>' + dt + '</b>' + (kb ? ' <span class="hint">' + kb + '</span>' : '') + '</div>' +
        '<div style="display:flex;gap:6px;flex-shrink:0"><button class="btn btn--ghost btn--sm" onclick="previewCloudSnapshot(\'' + esc(it.name) + '\')">预览</button><button class="btn btn--primary btn--sm" onclick="restoreCloudSnapshot(\'' + esc(it.name) + '\')">还原</button></div>' +
      '</div>';
    }).join('');
  });
}
function previewCloudSnapshot(name) {
  fetchCloudSnapshot(name, function (err, obj) {
    if (err || !obj) { toast(err || '读取失败', 'error'); return; }
    openModal({ title: '云端快照预览 · ' + name, content: recoveryStatsHtml(obj || {}), footer: '<button class="btn btn--secondary" onclick="closeModal()">关闭</button>' });
  });
}
function restoreCloudSnapshot(name) {
  fetchCloudSnapshot(name, function (err, obj) {
    if (err || !obj) { toast(err || '读取失败', 'error'); return; }
    dangerGuard({
      title: '还原云端快照',
      message: '将用云端这份快照<b>替换当前全部数据</b>。当前数据会先自动留底，可再还原回来。',
      tip: '确认这是你要回到的那个时间点。还原后若已开启同步，会自动推送到云端。',
      confirmText: '确认还原到该云端快照',
      onConfirm: function () { takeSnapshot('还原前'); applyRecoveryState(obj); closeModal(); toast('已还原到云端快照 ✅'); }
    });
  });
}
function manualCloudSnapshot() {
  if (!gtReady()) { toast('请先在「数据」→「多端同步」填写仓库信息', 'error'); return; }
  pushCloudSnapshot(JSON.stringify(snapshotPayload()), true);
  toast('已生成云端快照（稍后在此查看）');
  setTimeout(function () { renderCloudSnapshots(); }, 1500);
}

/* ================= 手机端保命：离开页面前抢推 =================
   手机上录完账立刻切走 App 或锁屏，系统会冻结页面，1.5 秒的延迟推送可能来不及执行 →
   这里在「页面被切走 / 关闭」的瞬间立即同步推送一次，把改动落到云端。 */
(function () {
  /* persist 之后标脏；推送成功后清脏 */
  var _origPersist = persist;
  window.persist = persist = function () { _dirtySinceSync = true; return _origPersist.apply(this, arguments); };
})();
function flushSyncNow(reason) {
  if (!_dirtySinceSync) return;
  try {
    var m = syncMeta();
    if (!m.enabled || !gtReady()) return;
    if (_pushTimer) { clearTimeout(_pushTimer); _pushTimer = null; }
    var st = cloudState();
    var c = gtCfg();
    var url = 'https://gitee.com/api/v5/repos/' + encodeURIComponent(c.owner) + '/' + encodeURIComponent(c.repo)
      + '/contents/' + CLOUD_SNAP_DIR + '/leave-' + Date.now() + '.json';
    var body = JSON.stringify({
      access_token: c.token,
      content: b64enc(JSON.stringify(st)),
      message: '离开页面自动存档 ' + (reason || '')
    });
    /* sendBeacon 在页面被冻结/关闭时仍能把请求发出去，是手机端最可靠的兜底 */
    var sent = false;
    if (navigator.sendBeacon) {
      try { sent = navigator.sendBeacon(url, new Blob([body], { type: 'application/json' })); } catch (e) { }
    }
    if (!sent) {
      try { fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: body, keepalive: true }); } catch (e) { }
    }
    _dirtySinceSync = false;
  } catch (e) { }
}
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'hidden') flushSyncNow('切到后台');
});
window.addEventListener('pagehide', function () { flushSyncNow('关闭页面'); });
/* 回到前台：拉一次云端，保证手机/电脑两端始终一致 */
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'visible') {
    try {
      var m = syncMeta();
      if (m.enabled && gtReady()) syncPull(function (changed) { if (changed) { renderAll(); try { toast('已同步最新数据', 'info'); } catch (e) { } } });
    } catch (e) { }
  }
});

/* ================= 启动 ================= */
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeModal(); });
init();
</script>
